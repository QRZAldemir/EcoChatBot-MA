<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Atendimento ao Cliente — Hospital Presbiteriano Marcx</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    /* ┏━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┓
       ┃ Core Colors — Cores Institucionais ┃
       ┗━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┛ */
    --mac-red:       #c8102e;
    --mac-red-dark:  #a00d24;
    --mac-red-light: #e8102e;
    --mac-red-pale:  #fff5f6;
    --mac-red-hover: #ffe0e4;
    
    /* ┏━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┓
       ┃ Secondary Colors — Cores Secundárias ┃
       ┗━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┛ */
    --green:         #25a244;
    --green-pale:    #f0fff4;
    --green-dark:    #1a7a33;
    
    --blue:          #1565c0;
    --blue-pale:     #e8f0fe;
    --blue-dark:     #0d47a1;
    
    --yellow:        #e6a817;
    --yellow-pale:   #fffbea;
    --yellow-dark:   #b07d0a;
    
    --purple:        #7b1fa2;
    --purple-pale:   #f9f0ff;
    --purple-dark:   #4a0072;
    
    /* ┏━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┓
       ┃ Chat & WhatsApp Theme — Tema Chat ┃
       ┗━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┛ */
    --wa-bg:         #f0ece8;
    --bubble-bot:    #ffffff;
    --bubble-user:   #ffd6d9;
    --wa-text:       #111b21;
    --wa-meta:       #667781;
    
    /* ┏━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┓
       ┃ Typography — Tipografia ┃
       ┗━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┛ */
    --font: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  }

  body {
    font-family: var(--font);
    background: #cfc8c4;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
  }

  .phone-wrap {
    width: 100%;
    max-width: 420px;
    height: 90vh;
    max-height: 820px;
    background: #111;
    border-radius: 40px;
    padding: 10px;
    box-shadow: 0 30px 80px rgba(0,0,0,0.55), inset 0 0 0 2px #2a2a2a;
    display: flex;
    flex-direction: column;
  }

  .screen {
    flex: 1; 
    background: var(--wa-bg);
    border-radius: 32px; 
    overflow: hidden;
    display: flex; 
    flex-direction: column;
  }

  /* ── Header ── */
  .header {
    background: var(--mac-red);
    padding: 10px 14px 10px 12px;
    display: flex; 
    align-items: center; 
    gap: 10px;
    flex-shrink: 0;
    box-shadow: 0 2px 6px rgba(0,0,0,0.25);
  }
  .mac-logo {
    width: 42px; height: 42px; 
    border-radius: 50%;
    background: #fff; 
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; 
    border: 2.5px solid rgba(255,255,255,0.45);
  }
  .mac-logo-ring {
    width: 34px; height: 34px; 
    border-radius: 50%;
    border: 3px solid var(--mac-red);
    display: flex; align-items: center; justify-content: center;
  }
  .mac-logo-ring span {
    font-family: 'Times New Roman', Georgia, serif;
    font-size: 19px; font-weight: 900; 
    color: var(--mac-red);
    line-height: 1; 
    margin-top: 1px;
  }
  .header-info { 
    flex: 1; 
    min-width: 0; 
  }
  .header-name {
    color: #fff; 
    font-weight: 700; 
    font-size: 12.5px;
    line-height: 1.25; 
    white-space: nowrap;
    overflow: hidden; 
    text-overflow: ellipsis;
  }
  .header-sub  { 
    color: rgba(255,255,255,0.75); 
    font-size: 10px; 
    line-height: 1.2; 
    margin-top: 1px; 
  }
  .header-status { 
    color: rgba(255,255,255,0.62); 
    font-size: 10.5px; 
    margin-top: 2px; 
  }
  .header-actions { 
    display: flex; 
    gap: 16px; 
    flex-shrink: 0; 
  }
  .header-actions svg { 
    width: 20px; 
    height: 20px; 
    fill: rgba(255,255,255,0.85); 
    cursor: pointer; 
  }

  /* ── Chat ── */
  .chat-area {
    flex: 1; 
    overflow-y: auto;
    padding: 12px 10px;
    display: flex; 
    flex-direction: column; 
    gap: 3px;
    scroll-behavior: smooth;
    background-image: url("data:image/svg+xml,%3Csvg width='52' height='52' viewBox='0 0 52 52' xmlns='http://www.w3.org/2000/svg'%3E%3Ccircle cx='26' cy='26' r='11' fill='none' stroke='%23c8102e' stroke-width='1' stroke-opacity='0.055'/%3E%3C/svg%3E");
  }
  .chat-area::-webkit-scrollbar { width: 4px; }
  .chat-area::-webkit-scrollbar-thumb { 
    background: rgba(200,16,46,0.18); 
    border-radius: 2px; 
  }

  .date-divider { 
    text-align: center; 
    margin: 8px 0; 
  }
  .date-divider span {
    background: rgba(255,255,255,0.88); 
    color: var(--wa-meta);
    font-size: 11.5px; 
    padding: 4px 12px;
    border-radius: 8px; 
    box-shadow: 0 1px 2px rgba(0,0,0,0.1);
  }

  /* ── Bubbles ── */
  .msg-row { 
    display: flex; 
    flex-direction: column; 
    margin-bottom: 2px; 
    position: relative;
  }
  .msg-row.bot  { align-items: flex-start; }
  .msg-row.user { align-items: flex-end; }

  .bubble {
    max-width: 85%; 
    padding: 8px 11px 6px;
    border-radius: 8px; 
    font-size: 14px; 
    line-height: 1.5;
    color: var(--wa-text); 
    word-break: break-word;
    box-shadow: 0 1px 2px rgba(0,0,0,0.12);
    opacity: 0; 
    transform: translateY(6px);
    animation: fadeUp 0.25s ease forwards;
    position: relative;
  }

  /* Botão de cópia na bolha */
  .bubble:hover::after {
    content: '📋';
    position: absolute;
    right: -28px;
    top: 50%;
    transform: translateY(-50%);
    cursor: pointer;
    font-size: 16px;
    opacity: 0.7;
    transition: opacity 0.2s;
  }
  .bubble:hover::after:hover { opacity: 1; }

  @keyframes fadeUp { 
    to { opacity: 1; transform: translateY(0); } 
  }

  .msg-row.bot  .bubble { 
    background: var(--bubble-bot);  
    border-top-left-radius: 2px; 
  }
  .msg-row.user .bubble { 
    background: var(--bubble-user); 
    border-top-right-radius: 2px; 
  }

  .bubble-time {
    font-size: 10.5px; 
    color: var(--wa-meta);
    margin-top: 2px; 
    display: flex; 
    align-items: center; 
    gap: 3px;
  }
  .msg-row.user .bubble-time { justify-content: flex-end; }
  .check-icon { color: var(--mac-red); font-size: 12px; }

  /* ── Typing ── */
  .typing-row { 
    display: flex; 
    align-items: flex-start; 
    margin-bottom: 4px; 
  }
  .typing-bubble {
    background: var(--bubble-bot); 
    border-radius: 8px; 
    border-top-left-radius: 2px;
    padding: 12px 14px; 
    box-shadow: 0 1px 2px rgba(0,0,0,0.1);
    display: flex; 
    gap: 5px; 
    align-items: center;
  }
  .typing-dot {
    width: 7px; 
    height: 7px; 
    background: #ccc; 
    border-radius: 50%;
    animation: bounce 1.2s infinite;
  }
  .typing-dot:nth-child(2) { animation-delay: 0.2s; }
  .typing-dot:nth-child(3) { animation-delay: 0.4s; }
  @keyframes bounce {
    0%,80%,100% { transform: translateY(0); background: #ccc; }
    40%         { transform: translateY(-5px); background: var(--mac-red); }
  }

  /* ═══════════════════════════════════════════ */
  /* ► BOTÕES COM CORES — INTERACTIVE BUTTON STYLES */
  /* ═══════════════════════════════════════════ */
  .options-wrap {
    display: flex; 
    flex-direction: column; 
    gap: 6px;
    margin-top: 4px; 
    opacity: 0;
    animation: fadeUp 0.3s ease 0.1s forwards;
  }
  
  .opt-btn {
    padding: 10px 15px; 
    border-radius: 20px;
    font-size: 13.5px; 
    font-family: var(--font); 
    font-weight: 500;
    border: 1.5px solid; 
    cursor: pointer; 
    text-align: left;
    transition: all 0.2s ease;
    line-height: 1.3;
  }
  .opt-btn:active { transform: scale(0.97); }
  .opt-btn:disabled { opacity: 0.42; pointer-events: none; }
  
  .opt-btn.verde { 
    background: var(--green-pale); 
    border-color: var(--green); 
    color: var(--green-dark); 
  }
  .opt-btn.verde:hover { 
    background: #d4f5de; 
    transform: translateX(2px); 
  }
  
  .opt-btn.azul { 
    background: var(--blue-pale); 
    border-color: var(--blue); 
    color: var(--blue-dark); 
  }
  .opt-btn.azul:hover { 
    background: #c3d8fd; 
    transform: translateX(2px); 
  }
  
  .opt-btn.vermelho { 
    background: var(--mac-red-pale); 
    border-color: var(--mac-red); 
    color: var(--mac-red-dark); 
  }
  .opt-btn.vermelho:hover { 
    background: var(--mac-red-hover); 
    transform: translateX(2px); 
  }
  
  .opt-btn.amarelo { 
    background: var(--yellow-pale); 
    border-color: var(--yellow); 
    color: var(--yellow-dark); 
  }
  .opt-btn.amarelo:hover { 
    background: #fff0c2; 
    transform: translateX(2px); 
  }
  
  .opt-btn.roxo { 
    background: var(--purple-pale); 
    border-color: var(--purple); 
    color: var(--purple-dark); 
  }
  .opt-btn.roxo:hover { 
    background: #edd9f7; 
    transform: translateX(2px); 
  }
  
  .opt-btn.default { 
    background: var(--mac-red-pale); 
    border-color: var(--mac-red); 
    color: var(--mac-red-dark); 
  }
  .opt-btn.default:hover { 
    background: var(--mac-red-hover); 
    transform: translateX(2px); 
  }

  /* ── Checklist / Summary card ── */
  .checklist-card, .summary-card {
    background: linear-gradient(135deg, var(--mac-red-dark), var(--mac-red-light));
    color: #fff; 
    border-radius: 14px;
    padding: 14px 16px; 
    margin-top: 8px;
    font-size: 13.5px; 
    line-height: 1.85;
    box-shadow: 0 4px 14px rgba(200,16,46,0.38);
  }
  .checklist-card .card-title, .summary-card .card-title {
    font-size: 14px; 
    font-weight: 700; 
    margin-bottom: 8px;
    border-bottom: 1px solid rgba(255,255,255,0.3);
    padding-bottom: 6px;
  }
  .checklist-card .row b, .summary-card .row b { font-weight: 700; }
  .checklist-card .row span, .summary-card .row span { opacity: 0.88; }
  .checklist-card .badge, .summary-card .badge {
    display: inline-block; background: rgba(255,255,255,0.22);
    border-radius: 6px; padding: 1px 8px; font-size: 11.5px; font-weight: 700; letter-spacing: 0.4px;
  }
  
  .summary-card.verde    { background: linear-gradient(135deg, var(--green-dark), var(--green)); }
  .summary-card.azul     { background: linear-gradient(135deg, var(--blue-dark), var(--blue)); }

  /* ── Info box ── */
  .info-box {
    background: #fff8f8;
    border-left: 3px solid var(--mac-red);
    border-radius: 0 6px 6px 0;
    padding: 10px 12px; 
    margin-top: 6px;
    font-size: 13px; 
    line-height: 1.6; 
    color: #333;
  }
  .info-box b { color: var(--mac-red-dark); }
  .info-box.verde { background: var(--green-pale); border-color: var(--green); }
  .info-box.verde b { color: var(--green-dark); }
  .info-box.azul { background: var(--blue-pale); border-color: var(--blue); }
  .info-box.azul b { color: var(--blue-dark); }
  .info-box.warning, .info-box.amarelo { background: var(--yellow-pale); border-color: var(--yellow); }
  .info-box.warning b, .info-box.amarelo b { color: var(--yellow-dark); }
  .info-box.success { background: var(--green-pale); border-color: var(--green); }

  /* ── LGPD banner ── */
  .lgpd-banner {
    background: #fff8e1; border: 1px solid #ffe082;
    border-radius: 8px; padding: 10px 12px; margin-top: 6px;
    font-size: 12px; line-height: 1.6; color: #555;
  }

  /* ── Input ── */
  .input-area {
    background: #ede8e4; 
    padding: 8px 10px;
    display: flex; 
    align-items: flex-end; 
    gap: 8px;
    flex-shrink: 0; 
    border-top: 1px solid #ddd;
  }
  .input-box-wrap {
    flex: 1; 
    background: #fff; 
    border-radius: 22px;
    display: flex; 
    align-items: flex-end;
    padding: 6px 14px; 
    gap: 8px;
    box-shadow: 0 1px 2px rgba(0,0,0,0.08);
  }
  .input-box-wrap:focus-within { box-shadow: 0 1px 5px rgba(200,16,46,0.2); }
  .input-emoji { 
    font-size: 20px; 
    cursor: pointer; 
    line-height: 1; 
    padding-bottom: 1px; 
  }
  #userInput {
    flex: 1; 
    border: none; 
    outline: none;
    font-family: var(--font); 
    font-size: 14.5px;
    color: var(--wa-text); 
    resize: none;
    max-height: 100px; 
    background: transparent;
    line-height: 1.45; 
    padding: 0;
  }
  #userInput::placeholder { color: #bbb; }
  .attach-icon { 
    font-size: 20px; 
    cursor: pointer; 
    opacity: 0.45; 
  }
  .send-btn {
    width: 46px; 
    height: 46px; 
    background: var(--mac-red);
    border: none; 
    border-radius: 50%;
    display: flex; 
    align-items: center; 
    justify-content: center;
    cursor: pointer; 
    flex-shrink: 0;
    transition: background 0.15s, transform 0.1s;
    box-shadow: 0 2px 8px rgba(200,16,46,0.45);
  }
  .send-btn:hover  { 
    background: var(--mac-red-dark); 
    transform: scale(1.05); 
  }
  .send-btn:active { 
    transform: scale(0.95); 
  }
  .send-btn svg { 
    width: 22px; 
    height: 22px; 
    fill: #fff; 
  }

  /* ── Feedback inline ── */
  .input-feedback {
    font-size: 11.5px; padding: 4px 14px; margin: 0 10px 2px;
    border-radius: 8px; animation: fadeUp 0.2s ease forwards;
  }
  .input-feedback.error   { background: #fdecea; color: #b71c1c; }
  .input-feedback.success { background: var(--green-pale); color: var(--green-dark); }
  .input-feedback.hint    { background: var(--blue-pale);  color: var(--blue-dark); }

  /* ── Toast de confirmação ── */
  .toast {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,0.85);
    color: #fff;
    padding: 12px 20px;
    border-radius: 8px;
    font-size: 13px;
    z-index: 9999;
    animation: slideUp 0.3s ease;
  }
  @keyframes slideUp {
    from { transform: translateX(-50%) translateY(20px); opacity: 0; }
    to { transform: translateX(-50%) translateY(0); opacity: 1; }
  }
</style>
</head>
<body>

<div class="phone-wrap">
  <div class="screen">

    <div class="header">
      <div class="mac-logo">
        <div class="mac-logo-ring"><span>M</span></div>
      </div>
      <div class="header-info">
        <div class="header-name">Atendimento ao Cliente — H. P. Marcx</div>
        <div class="header-sub">Dr. e Sra. Goldsby King — Dourados/MS</div>
        <div class="header-status" id="headerStatus">● online</div>
      </div>
      <div class="header-actions">
        <svg viewBox="0 0 24 24"><path d="M15.9 14.3H15l-.3-.3c1-1.1 1.6-2.7 1.6-4.3 0-3.7-3-6.7-6.7-6.7S3 5.9 3 9.7s3 6.7 6.7 6.7c1.6 0 3.1-.6 4.3-1.6l.3.3v.8l5.1 5.1 1.5-1.5-5-5.2zm-6.2 0C7 14.3 4.7 12 4.7 9.2S7 4.1 9.7 4.1s5.1 2.3 5.1 5.1-2.3 5.1-5.1 5.1z"/></svg>
        <svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="12" cy="19" r="1.5"/></svg>
      </div>
    </div>

    <div class="chat-area" id="chatArea">
      <div class="date-divider"><span>Hoje</span></div>
    </div>

    <div class="input-area">
      <div class="input-box-wrap">
        <span class="input-emoji" id="emojiBtn" onclick="toggleEmoji()">😊</span>
        <textarea id="userInput" rows="1" placeholder="Escolha uma opção acima" disabled></textarea>
        <span class="attach-icon">📎</span>
      </div>
      <button class="send-btn" onclick="sendMessage()">
        <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
      </button>
    </div>

  </div>
</div>

<script>
// ═══════════════════════════════════════════════════════════════════════
// 🔧 LOGGER — Sistema de Logging para Eventos (Observabilidade)
// ═══════════════════════════════════════════════════════════════════════
class ChatLogger {
  constructor() {
    this.events = [];
    this.sessionId = this.gerarSessionId();
  }
  gerarSessionId() { return `SESS-${Date.now()}-${Math.random().toString(36).substr(2, 9)}`; }
  log(tipo, dados) {
    const evento = { timestamp: new Date().toISOString(), sessionId: this.sessionId, tipo, dados };
    this.events.push(evento);
    console.log(`[${tipo}]`, evento);
  }
}
const logger = new ChatLogger();

// ═══════════════════════════════════════════════════════════════════════
// 📋 SISTEMA DE CÓPIA COM FORMATAÇÃO — Copia Markdown pronto para ZigChat
// ═══════════════════════════════════════════════
class CopyFormatter {
  static htmlParaMarkdown(htmlElement) {
    let markdown = '';
    if (htmlElement.nodeType === 3) return htmlElement.textContent;
    if (htmlElement.tagName === 'B' || htmlElement.tagName === 'STRONG') return `**${htmlElement.textContent}**`;
    if (htmlElement.tagName === 'I' || htmlElement.tagName === 'EM') return `*${htmlElement.textContent}*`;
    if (htmlElement.tagName === 'BR') return '\n';
    if (htmlElement.className.includes('checklist-card') || htmlElement.className.includes('summary-card')) {
      let conteudo = '';
      Array.from(htmlElement.childNodes).forEach(node => { conteudo += this.htmlParaMarkdown(node); });
      return `\n\`\`\`\n${conteudo}\n\`\`\`\n`;
    }
    if (htmlElement.className.includes('info-box')) {
      let conteudo = '';
      Array.from(htmlElement.childNodes).forEach(node => { conteudo += this.htmlParaMarkdown(node); });
      return `\n> ${conteudo}\n`;
    }
    let resultado = '';
    Array.from(htmlElement.childNodes).forEach(node => { resultado += this.htmlParaMarkdown(node); });
    return resultado;
  }

  static copiarBolhaFormatada(elemento) {
    const bubble = elemento.querySelector('.bubble');
    if (!bubble) return;
    const conteudoMarkdown = this.htmlParaMarkdown(bubble);
    navigator.clipboard.writeText(conteudoMarkdown).then(() => {
      this.mostrarToast('✅ Copiado com formatação para ZigChat!');
      logger.log('COPY_FORMATTED', { conteudo: conteudoMarkdown.substring(0, 50) });
    });
  }

  static mostrarToast(mensagem) {
    const toast = document.createElement('div');
    toast.className = 'toast';
    toast.textContent = mensagem;
    document.body.appendChild(toast);
    setTimeout(() => {
      toast.style.animation = 'slideUp 0.3s ease reverse';
      setTimeout(() => toast.remove(), 300);
    }, 2000);
  }
}

// ═══════════════════════════════════════════════════════════════════════
//  UTIL — PROCESSAMENTO INTELIGENTE DE DADOS
// ═══════════════════════════════════════════════════════════════════════
function normalizeText(str) {
  if (!str) return '';
  return str.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toUpperCase().trim();
}

function validarCPF(cpf) {
  cpf = cpf.replace(/\D/g,'');
  if (cpf.length !== 11 || /^(\d)\1+$/.test(cpf)) return false;
  let s = 0; for(let i=0; i<9; i++) s += +cpf[i]*(10-i);
  let r = (s*10)%11; if(r===10 || r===11) r=0;
  if(r !== +cpf[9]) return false;
  s = 0; for(let i=0; i<10; i++) s += +cpf[i]*(11-i);
  r = (s*10)%11; if(r===10 || r===11) r=0;
  return r === +cpf[10];
}

function formatCPF(cpf) {
  cpf = (cpf||'').replace(/\D/g,'');
  if(cpf.length !== 11) return cpf;
  return cpf.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/, '$1.$2.$3-$4');
}

/**
 * Interpretador Avançado de Datas (Padrão Brasil) - Unificado do módulo Agendamento
 */
function interpretarEValidarDataBr(txt) {
  if (!txt) return null;
  let limpo = txt.trim().replace(/[-.\s]+/g, '/');
  
  if (!limpo.includes('/')) {
    let num = limpo.replace(/\D/g, '');
    if (num.length === 6) {
      limpo = `${num.substring(0, 2)}/${num.substring(2, 4)}/${num.substring(4, 6)}`;
    } else if (num.length === 8) {
      limpo = `${num.substring(0, 2)}/${num.substring(2, 4)}/${num.substring(4, 8)}`;
    }
  }

  const partes = limpo.split('/');
  if (partes.length !== 3) return null;

  let dia = parseInt(partes[0], 10);
  let mes = parseInt(partes[1], 10);
  let anoStr = partes[2].replace(/\D/g, '');
  let ano = parseInt(anoStr, 10);

  if (isNaN(dia) || isNaN(mes) || isNaN(ano)) return null;

  if (anoStr.length === 2) {
    ano += (ano <= 26) ? 2000 : 1900;
  }

  const dataTeste = new Date(ano, mes - 1, dia);
  if (dataTeste.getFullYear() !== ano || dataTeste.getMonth() !== mes - 1 || dataTeste.getDate() !== dia) return null;

  const hoje = new Date();
  if (dataTeste > hoje || ano < 1900) return null;

  const diaPadrao = String(dia).padStart(2, '0');
  const mesPadrao = String(mes).padStart(2, '0');
  
  return {
    dataFormatada: `${diaPadrao}/${mesPadrao}/${ano}`,
    idade: hoje.getFullYear() - dataTeste.getFullYear() - ((hoje.getMonth() < dataTeste.getMonth() || (hoje.getMonth() === dataTeste.getMonth() && hoje.getDate() < dataTeste.getDate())) ? 1 : 0)
  };
}

// ════════════════════════════════════════════════
//  SOM (Web Audio API)
// ════════════════════════════════════════════════
function playSound(type) {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator(), gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination); const t = ctx.currentTime;
    if (type === 'recv') {
      osc.frequency.setValueAtTime(880, t); osc.frequency.exponentialRampToValueAtTime(1320, t + 0.1);
      gain.gain.setValueAtTime(0.07, t); gain.gain.exponentialRampToValueAtTime(0.001, t + 0.22);
      osc.start(t); osc.stop(t + 0.22);
    } else {
      osc.frequency.setValueAtTime(1320, t); osc.frequency.exponentialRampToValueAtTime(880, t + 0.08);
      gain.gain.setValueAtTime(0.06, t); gain.gain.exponentialRampToValueAtTime(0.001, t + 0.15);
      osc.start(t); osc.stop(t + 0.15);
    }
  } catch(e) {}
}

function gerarProtocolo(prefixo='AC') {
  const d = new Date(), ano = d.getFullYear(), mes = String(d.getMonth()+1).padStart(2,'0'), dia = String(d.getDate()).padStart(2,'0');
  state.contadorProtocolo = (state.contadorProtocolo + 1) % 10000;
  return `${prefixo}${ano}${mes}${dia}-${String(state.contadorProtocolo).padStart(4,'0')}-${Math.floor(1000+Math.random()*9000)}`;
}

function addBotBubble(html, delay = 0) {
  return new Promise(resolve => {
    setTimeout(() => {
      const row = document.createElement('div'); row.className = 'msg-row bot';
      row.innerHTML = `<div class="bubble">${html}</div><div class="bubble-time">${now()}</div>`;
      row.addEventListener('click', () => CopyFormatter.copiarBolhaFormatada(row));
      chat().appendChild(row); chat().scrollTop = chat().scrollHeight;
      playSound('recv'); resolve();
    }, delay);
  });
}

function addUserBubble(text) {
  const row = document.createElement('div'); row.className = 'msg-row user';
  row.innerHTML = `<div class="bubble">${text}</div><div class="bubble-time">${now()} <span class="check-icon">✓✓</span></div>`;
  chat().appendChild(row); chat().scrollTop = chat().scrollHeight;
  logger.log('USER_INPUT', { texto: text.substring(0, 50) });
}

function addOptions(opts, delay = 0) {
  document.querySelectorAll('.opt-btn').forEach(b => { b.disabled = true; b.style.opacity = '0.45'; });
  setTimeout(() => {
    const wrap = document.createElement('div'); wrap.className = 'options-wrap';
    opts.forEach(o => {
      const btn = document.createElement('button'); btn.className = 'opt-btn default';
      if (o.label.includes('Sim') || o.label.includes('Principal') || o.label.includes('Menu')) btn.className = 'opt-btn verde';
      if (o.label.includes('Não') || o.label.includes('Voltar')) btn.className = 'opt-btn vermelho';
      if (o.label.includes('Atendente') || o.label.includes('Falar')) btn.className = 'opt-btn azul';
      btn.innerHTML = o.label;
      
      btn.onclick = () => {
        wrap.querySelectorAll('.opt-btn').forEach(b => { b.disabled = true; b.style.opacity = '0.5'; });
        playSound('send'); addUserBubble(o.label); o.action();
      };
      wrap.appendChild(btn);
    });
    chat().appendChild(wrap); chat().scrollTop = chat().scrollHeight;
  }, delay);
}

function showTyping(ms = 500) {
  return new Promise(resolve => {
    setHeaderTyping(true);
    const row = document.createElement('div'); row.className = 'typing-row'; row.id = 'typingRow';

    setTimeout(() => { const el = getEl('typingRow'); if(el) el.remove(); setHeaderTyping(false); resolve(); }, ms);
  });
}

function removeFeedback() { document.querySelectorAll('.input-feedback').forEach(el => el.remove()); }
function showFeedback(msg, type = 'hint') {

  const ia = document.querySelector('.input-area'); ia.parentNode.insertBefore(fb, ia);
}

function enableInput(ph = 'Digite sua resposta...', type = 'text') {
  const inp = getEl('userInput'); inp.disabled = false; inp.placeholder = ph; setTimeout(() => inp.focus(), 100);
  if(type === 'numeric') inp.setAttribute('inputmode', 'numeric'); else inp.removeAttribute('inputmode');
  state.aguardandoTexto = true;
}

function disableInput() { const inp = getEl('userInput'); inp.disabled = true; inp.placeholder = 'Escolha uma opção acima'; inp.removeAttribute('inputmode'); state.aguardandoTexto = false; removeFeedback(); }

// Seletor de Emojis integrado
const EMOJIS = ['😊','👍','❓','📋','🏥','💊','📞','🙏','✅','❤️','😅','👋'];
function toggleEmoji() {
  if (!state.aguardandoTexto) return;
  const ex = document.getElementById('emojiPicker'); if (ex) { ex.remove(); return; }
  const picker = document.createElement('div'); picker.id = 'emojiPicker';
  EMOJIS.forEach(em => {

    b.onclick = () => { const inp = getEl('userInput'); inp.value += em; inp.focus(); picker.remove(); };
    picker.appendChild(b);
  });

}

function sendMessage() {
  if (!state.aguardandoTexto) return;
  const inp = getEl('userInput'); const txt = inp.value.trim(); if (!txt) return;
  inp.value = ''; inp.style.height = 'auto'; disableInput(); playSound('send'); addUserBubble(txt); processStep(txt);
}
getEl('userInput').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); } });

// Realimentação em tempo real para digitação assistida
getEl('userInput').addEventListener('input', function() {
  this.style.height = 'auto'; this.style.height = Math.min(this.scrollHeight, 100) + 'px';

  if (state.step === 'DOC_CPF') {
    let v = this.value.replace(/\D/g,'');
    v = v.replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3})\.(\d{3})(\d)/,'$1.$2.$3').replace(/(\d{3})\.(\d{3})\.(\d{3})(\d)/,'$1.$2.$3-$4');
    this.value = v.slice(0,14);
    if (v.replace(/\D/g,'').length === 11) showFeedback(validarCPF(v) ? '✅ CPF válido' : '⚠️ CPF inválido — verifique os dígitos', validarCPF(v) ? 'success' : 'error');
    else removeFeedback();
  }
  if (state.step === 'DOC_NASCIMENTO') {
    let raw = this.value.replace(/\D/g, '');
    if (raw.length >= 6) {
      const res = interpretarEValidarDataBr(this.value);
      if (res) showFeedback(`✅ Data reconhecida: ${res.dataFormatada}`, 'success');
      else showFeedback('⚠️ Formato não reconhecido ou inexistente.', 'error');
    } else { removeFeedback(); }
  }
});

// ════════════════════════════════════════════════
//  MAQUINA DE ESTADOS / TEXT ROUTER
// ════════════════════════════════════════════════
async function processStep(text) {
  state.aguardandoTexto = false; removeFeedback();
  await showTyping(700);

  switch(state.step) {
    case 'ID_NOME_CIDADE': {
      const parts = text.split('|').map(p => p.trim());
      state.dados.nome = parts[0] || 'Visitante';
      state.dados.cidade = parts[1] || 'não informada';
      const fn = state.dados.nome.split(' ')[0];
      await addBotBubble(`✨ Que prazer, <b>${fn}</b>! Obrigado por entrar em contato.`);
      await addBotBubble(`📍 Localizamos sua região de contato como: <b>${state.dados.cidade}</b>. Como posso te auxiliar hoje?`);
      await mostrarMenuPrincipal();
      break;
    }

    case 'DOC_MEDICO':
      state.dados.doc_medico = text;
      await addBotBubble(`✅ Anotado! Agora informe a <b>data do atendimento</b>.<br><small style="color:var(--wa-meta)">Ex: 15/03/2024</small>`);
      state.step = 'DOC_DATA'; enableInput('DD/MM/AAAA...');
      break;

    case 'DOC_DATA':
      state.dados.doc_data = text;
      await addBotBubble(`✅ Perfeito! Qual o <b>motivo básico da solicitação</b>?<br><small style="color:var(--wa-meta)">Ex: Reembolso, uso pessoal, trabalho</small>`);
      state.step = 'DOC_MOTIVO'; enableInput('Motivo da solicitação...');
      break;

    case 'DOC_MOTIVO':
      state.dados.doc_motivo = text;
      await addBotBubble(`🛡️ Entendido! Para vincular ao sistema, informe o <b>CPF do paciente</b>:`);
      state.step = 'DOC_CPF'; enableInput('000.000.000-00', 'numeric');
      break;

    case 'DOC_CPF': {
      if (!validarCPF(text)) {
        await addBotBubble(`⚠️ Esse documento CPF consta como inconsistente. Poderia conferir e digitar novamente?`);
        state.step = 'DOC_CPF'; enableInput('000.000.000-00', 'numeric');
        break;
      }
      state.dados.doc_cpf = text.replace(/\D/g,'');
      await addBotBubble(`✅ CPF validado com sucesso! Última etapa: informe a <b>data de nascimento</b>.`);
      state.step = 'DOC_NASCIMENTO'; enableInput('Ex: 24/04/1977 ou 240477');
      break;
    }

    case 'DOC_NASCIMENTO': {
      const dataInterpretada = interpretarEValidarDataBr(text);
      if (dataInterpretada === null) {
        await addBotBubble('⚠️ <b>Data de nascimento inválida!</b><br>Por favor, envie uma data válida (Ex: 24/04/1977).');
        state.step = 'DOC_NASCIMENTO'; enableInput('Tente novamente...');
        break;
      }
      state.dados.doc_nascimento = dataInterpretada.dataFormatada;
      state.dados.doc_idade = dataInterpretada.idade;
      await encerrarSegundaVia();
      break;
    }

    case 'ESP_MOTIVO':
      state.dados.resumo_assunto = text;
      await confirmarFilaEspera();
      break;
  }
}
