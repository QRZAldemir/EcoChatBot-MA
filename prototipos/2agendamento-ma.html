<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agendamento — Hospital Presbiteriano Marcx</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --mac-red:       #c8102e;
    --mac-red-dark:  #a00d24;
    --mac-red-light: #e8102e;
    --mac-red-pale:  #fff5f6;
    --mac-red-hover: #ffe0e4;
    
    --green:         #25a244;
    --green-pale:    #f0fff4;
    --green-dark:    #1a7a33;
    
    --blue:          #1565c0;
    --blue-pale:     #e8f0fe;
    --blue-dark:     #0d47a1;
    
    --yellow:        #e6a817;
    --yellow-pale:   #fffbea;
    --yellow-dark:   #b07d0a;
    
    --purple:        #7b1fa2;
    --purple-pale:   #f9f0ff;
    --purple-dark:   #4a0072;
    
    --wa-bg:         #f0ece8;
    --bubble-bot:    #ffffff;
    --bubble-user:   #ffd6d9;
    --wa-text:       #111b21;
    --wa-meta:       #667781;
    
    --font: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  }

  body {
    font-family: var(--font);
    background: #cfc8c4;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
  }

  .phone-wrap {
    width: 100%;
    max-width: 420px;
    height: 90vh;
    max-height: 820px;
    background: #111;
    border-radius: 40px;
    padding: 10px;
    box-shadow: 0 30px 80px rgba(0,0,0,0.55), inset 0 0 0 2px #2a2a2a;
    display: flex;
    flex-direction: column;
  }

  .screen {
    flex: 1; 
    background: var(--wa-bg);
    border-radius: 32px; 
    overflow: hidden;
    display: flex; 
    flex-direction: column;
  }

  /* ── Header ── */
  .header {
    background: var(--mac-red);
    padding: 10px 14px 10px 12px;
    display: flex; 
    align-items: center; 
    gap: 10px;
    flex-shrink: 0;
    box-shadow: 0 2px 6px rgba(0,0,0,0.25);
  }
  .mac-logo {
    width: 42px; height: 42px; 
    border-radius: 50%;
    background: #fff; 
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; 
    border: 2.5px solid rgba(255,255,255,0.45);
  }
  .mac-logo-ring {
    width: 34px; height: 34px; 
    border-radius: 50%;
    border: 3px solid var(--mac-red);
    display: flex; align-items: center; justify-content: center;
  }
  .mac-logo-ring span {
    font-family: 'Times New Roman', Georgia, serif;
    font-size: 19px; font-weight: 900; 
    color: var(--mac-red);
    line-height: 1; 
    margin-top: 1px;
  }
  .header-info { 
    flex: 1; 
    min-width: 0; 
  }
  .header-name {
    color: #fff; 
    font-weight: 700; 
    font-size: 12.5px;
    line-height: 1.25; 
    white-space: nowrap;
    overflow: hidden; 
    text-overflow: ellipsis;
  }
  .header-sub  { 
    color: rgba(255,255,255,0.75); 
    font-size: 10px; 
    line-height: 1.2; 
    margin-top: 1px; 
  }
  .header-status { 
    color: rgba(255,255,255,0.62); 
    font-size: 10.5px; 
    margin-top: 2px; 
  }
  .header-actions { 
    display: flex; 
    gap: 16px; 
    flex-shrink: 0; 
  }
  .header-actions svg { 
    width: 20px; 
    height: 20px; 
    fill: rgba(255,255,255,0.85); 
    cursor: pointer; 
  }

  /* ── Chat ── */
  .chat-area {
    flex: 1; 
    overflow-y: auto;
    padding: 12px 10px;
    display: flex; 
    flex-direction: column; 
    gap: 3px;
    scroll-behavior: smooth;
    background-image: url("data:image/svg+xml,%3Csvg width='52' height='52' viewBox='0 0 52 52' xmlns='http://www.w3.org/2000/svg'%3E%3Ccircle cx='26' cy='26' r='11' fill='none' stroke='%23c8102e' stroke-width='1' stroke-opacity='0.055'/%3E%3C/svg%3E");
  }
  .chat-area::-webkit-scrollbar { width: 4px; }
  .chat-area::-webkit-scrollbar-thumb { 
    background: rgba(200,16,46,0.18); 
    border-radius: 2px; 
  }

  .date-divider { 
    text-align: center; 
    margin: 8px 0; 
  }
  .date-divider span {
    background: rgba(255,255,255,0.88); 
    color: var(--wa-meta);
    font-size: 11.5px; 
    padding: 4px 12px;
    border-radius: 8px; 
    box-shadow: 0 1px 2px rgba(0,0,0,0.1);
  }

  /* ── Bubbles ── */
  .msg-row { 
    display: flex; 
    flex-direction: column; 
    margin-bottom: 2px; 
    position: relative;
  }
  .msg-row.bot  { align-items: flex-start; }
  .msg-row.user { align-items: flex-end; }

  .bubble {
    max-width: 85%; 
    padding: 8px 11px 6px;
    border-radius: 8px; 
    font-size: 14px; 
    line-height: 1.5;
    color: var(--wa-text); 
    word-break: break-word;
    box-shadow: 0 1px 2px rgba(0,0,0,0.12);
    opacity: 0; 
    transform: translateY(6px);
    animation: fadeUp 0.25s ease forwards;
    position: relative;
  }

  /* Botão de cópia na bolha */
  .bubble:hover::after {
    content: '📋';
    position: absolute;
    right: -28px;
    top: 50%;
    transform: translateY(-50%);
    cursor: pointer;
    font-size: 16px;
    opacity: 0.7;
    transition: opacity 0.2s;
  }

  .bubble:hover::after:hover {
    opacity: 1;
  }

  @keyframes fadeUp { 
    to { opacity: 1; transform: translateY(0); } 
  }

  .msg-row.bot  .bubble { 
    background: var(--bubble-bot);  
    border-top-left-radius: 2px; 
  }
  .msg-row.user .bubble { 
    background: var(--bubble-user); 
    border-top-right-radius: 2px; 
  }

  .bubble-time {
    font-size: 10.5px; 
    color: var(--wa-meta);
    margin-top: 2px; 
    display: flex; 
    align-items: center; 
    gap: 3px;
  }
  .msg-row.user .bubble-time { justify-content: flex-end; }
  .check-icon { color: var(--mac-red); font-size: 12px; }

  /* ── Typing ── */
  .typing-row { 
    display: flex; 
    align-items: flex-start; 
    margin-bottom: 4px; 
  }
  .typing-bubble {
    background: var(--bubble-bot); 
    border-radius: 8px; 
    border-top-left-radius: 2px;
    padding: 12px 14px; 
    box-shadow: 0 1px 2px rgba(0,0,0,0.1);
    display: flex; 
    gap: 5px; 
    align-items: center;
  }
  .typing-dot {
    width: 7px; 
    height: 7px; 
    background: #ccc; 
    border-radius: 50%;
    animation: bounce 1.2s infinite;
  }
  .typing-dot:nth-child(2) { animation-delay: 0.2s; }
  .typing-dot:nth-child(3) { animation-delay: 0.4s; }
  @keyframes bounce {
    0%,80%,100% { transform: translateY(0); background: #ccc; }
    40%         { transform: translateY(-5px); background: var(--mac-red); }
  }

  /* ═══════════════════════════════════════════ */
  /* ► BOTÕES COM CORES — INTERACTIVE BUTTON STYLES */
  /* ═══════════════════════════════════════════ */
  .options-wrap {
    display: flex; 
    flex-direction: column; 
    gap: 6px;
    margin-top: 4px; 
    opacity: 0;
    animation: fadeUp 0.3s ease 0.1s forwards;
  }
  
  .opt-btn {
    padding: 10px 15px; 
    border-radius: 20px;
    font-size: 13.5px; 
    font-family: var(--font); 
    font-weight: 500;
    border: 1.5px solid; 
    cursor: pointer; 
    text-align: left;
    transition: all 0.2s ease;
    line-height: 1.3;
  }
  .opt-btn:active { transform: scale(0.97); }
  .opt-btn:disabled { opacity: 0.42; pointer-events: none; }
  
  .opt-btn.verde { 
    background: var(--green-pale); 
    border-color: var(--green); 
    color: var(--green-dark); 
  }
  .opt-btn.verde:hover { 
    background: #d4f5de; 
    transform: translateX(2px); 
  }
  
  .opt-btn.azul { 
    background: var(--blue-pale); 
    border-color: var(--blue); 
    color: var(--blue-dark); 
  }
  .opt-btn.azul:hover { 
    background: #c3d8fd; 
    transform: translateX(2px); 
  }
  
  .opt-btn.vermelho { 
    background: var(--mac-red-pale); 
    border-color: var(--mac-red); 
    color: var(--mac-red-dark); 
  }
  .opt-btn.vermelho:hover { 
    background: var(--mac-red-hover); 
    transform: translateX(2px); 
  }
  
  .opt-btn.amarelo { 
    background: var(--yellow-pale); 
    border-color: var(--yellow); 
    color: var(--yellow-dark); 
  }
  .opt-btn.amarelo:hover { 
    background: #fff0c2; 
    transform: translateX(2px); 
  }
  
  .opt-btn.roxo { 
    background: var(--purple-pale); 
    border-color: var(--purple); 
    color: var(--purple-dark); 
  }
  .opt-btn.roxo:hover { 
    background: #edd9f7; 
    transform: translateX(2px); 
  }
  
  .opt-btn.default { 
    background: var(--mac-red-pale); 
    border-color: var(--mac-red); 
    color: var(--mac-red-dark); 
  }
  .opt-btn.default:hover { 
    background: var(--mac-red-hover); 
    transform: translateX(2px); 
  }

  /* ── Checklist card ── */
  .checklist-card {
    background: linear-gradient(135deg, var(--mac-red-dark), var(--mac-red-light));
    color: #fff; 
    border-radius: 14px;
    padding: 14px 16px; 
    margin-top: 8px;
    font-size: 13.5px; 
    line-height: 1.85;
    box-shadow: 0 4px 14px rgba(200,16,46,0.38);
  }
  .checklist-card .card-title {
    font-size: 14px; 
    font-weight: 700; 
    margin-bottom: 8px;
    border-bottom: 1px solid rgba(255,255,255,0.3);
    padding-bottom: 6px;
  }
  .checklist-card .row b   { font-weight: 700; }
  .checklist-card .row span { opacity: 0.88; }

  /* ── Info box ── */
  .info-box {
    background: #fff8f8;
    border-left: 3px solid var(--mac-red);
    border-radius: 0 6px 6px 0;
    padding: 10px 12px; 
    margin-top: 6px;
    font-size: 13px; 
    line-height: 1.6; 
    color: #333;
  }
  .info-box b { color: var(--mac-red-dark); }

  /* ── Input ── */
  .input-area {
    background: #ede8e4; 
    padding: 8px 10px;
    display: flex; 
    align-items: flex-end; 
    gap: 8px;
    flex-shrink: 0; 
    border-top: 1px solid #ddd;
  }
  .input-box-wrap {
    flex: 1; 
    background: #fff; 
    border-radius: 22px;
    display: flex; 
    align-items: flex-end;
    padding: 6px 14px; 
    gap: 8px;
    box-shadow: 0 1px 2px rgba(0,0,0,0.08);
  }
  .input-emoji { 
    font-size: 20px; 
    cursor: pointer; 
    line-height: 1; 
    padding-bottom: 1px; 
  }
  #userInput {
    flex: 1; 
    border: none; 
    outline: none;
    font-family: var(--font); 
    font-size: 14.5px;
    color: var(--wa-text); 
    resize: none;
    max-height: 100px; 
    background: transparent;
    line-height: 1.45; 
    padding: 0;
  }
  #userInput::placeholder { color: #bbb; }
  .attach-icon { 
    font-size: 20px; 
    cursor: pointer; 
    opacity: 0.45; 
  }
  .send-btn {
    width: 46px; 
    height: 46px; 
    background: var(--mac-red);
    border: none; 
    border-radius: 50%;
    display: flex; 
    align-items: center; 
    justify-content: center;
    cursor: pointer; 
    flex-shrink: 0;
    transition: background 0.15s, transform 0.1s;
    box-shadow: 0 2px 8px rgba(200,16,46,0.45);
  }
  .send-btn:hover  { 
    background: var(--mac-red-dark); 
    transform: scale(1.05); 
  }
  .send-btn:active { 
    transform: scale(0.95); 
  }
  .send-btn svg { 
    width: 22px; 
    height: 22px; 
    fill: #fff; 
  }

  /* ── Toast de confirmação ── */
  .toast {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,0.85);
    color: #fff;
    padding: 12px 20px;
    border-radius: 8px;
    font-size: 13px;
    z-index: 9999;
    animation: slideUp 0.3s ease;
  }
  @keyframes slideUp {
    from { transform: translateX(-50%) translateY(20px); opacity: 0; }
    to { transform: translateX(-50%) translateY(0); opacity: 1; }
  }
</style>
</head>

<script>
// ═══════════════════════════════════════════════════════════════════════
// 🔧 LOGGER — Sistema de Logging para Eventos (Observabilidade)
// ═══════════════════════════════════════════════════════════════════════
class ChatLogger {
  constructor() {
    this.events = [];
    this.sessionId = this.gerarSessionId();
  }

  gerarSessionId() {
    return `SESS-${Date.now()}-${Math.random().toString(36).substr(2, 9)}`;
  }

  log(tipo, dados) {
    const evento = {
      timestamp: new Date().toISOString(),
      sessionId: this.sessionId,
      tipo,
      dados,
    };
    this.events.push(evento);
    
    // Envia para backend a cada 10 eventos (ou manualmente)
    if (this.events.length % 10 === 0) {
      this.enviarParaBackend();
    }

    console.log(`[${tipo}]`, evento);
  }

  enviarParaBackend() {
    if (this.events.length === 0) return;
    
    // IMPORTANTE: Substituir pela sua API real
    // const payload = {
    //   sessionId: this.sessionId,
    //   eventos: this.events.splice(0),
    //   userAgent: navigator.userAgent,
    // };
    // fetch('https://seu-backend.com/api/chatbot-logs', {
    //   method: 'POST',
    //   headers: { 'Content-Type': 'application/json' },
    //   body: JSON.stringify(payload),
    // }).catch(err => console.error('Erro ao enviar logs:', err));
  }

  exportarJSON() {
    return JSON.stringify(this.events, null, 2);
  }
}

const logger = new ChatLogger();

// ═══════════════════════════════════════════════════════════════════════
// 📋 SISTEMA DE CÓPIA COM FORMATAÇÃO — Copia Markdown/HTML pronto para ZigChat
// ═══════════════════════════════════════════════════════════════════════
class CopyFormatter {
  /**
   * Converte HTML renderizado em Markdown limpo
   * Preserva estrutura e emojis para colar em ZigChat
   */
  static htmlParaMarkdown(htmlElement) {
    let markdown = '';
    
    if (htmlElement.nodeType === 3) { // Text node
      return htmlElement.textContent;
    }

    if (htmlElement.tagName === 'B' || htmlElement.tagName === 'STRONG') {
      return `**${htmlElement.textContent}**`;
    }

    if (htmlElement.tagName === 'I' || htmlElement.tagName === 'EM') {
      return `*${htmlElement.textContent}*`;
    }

    if (htmlElement.tagName === 'BR') {
      return '\n';
    }

    if (htmlElement.className.includes('checklist-card')) {
      let conteudo = '';
      Array.from(htmlElement.childNodes).forEach(node => {
        conteudo += this.htmlParaMarkdown(node);
      });
      return `\n\`\`\`\n${conteudo}\n\`\`\`\n`;
    }

    if (htmlElement.className.includes('info-box')) {
      let conteudo = '';
      Array.from(htmlElement.childNodes).forEach(node => {
        conteudo += this.htmlParaMarkdown(node);
      });
      return `\n> ${conteudo}\n`;
    }

    // Caso padrão: processa filhos
    let resultado = '';
    Array.from(htmlElement.childNodes).forEach(node => {
      resultado += this.htmlParaMarkdown(node);
    });

    return resultado;
  }

  /**
   * Copia texto da bolha como Markdown formatado
   * Pronto para colar em WhatsApp, ZigChat, etc.
   */
  static copiarBolhaFormatada(elemento) {
    const bubble = elemento.querySelector('.bubble');
    if (!bubble) return;

    const conteudoMarkdown = this.htmlParaMarkdown(bubble);
    
    navigator.clipboard.writeText(conteudoMarkdown).then(() => {
      this.mostrarToast('✅ Copiado com formatação para ZigChat!');
      logger.log('COPY_FORMATTED', { conteudo: conteudoMarkdown.substring(0, 100) });
    }).catch(err => {
      console.error('Erro ao copiar:', err);
      logger.log('COPY_ERROR', { erro: err.message });
    });
  }

  /**
   * Copia o CHECKLIST inteiro em Markdown formatado
   */
  static copiarChecklistFormatado() {
    const checklist = document.querySelector('.checklist-card');
    if (!checklist) return;

    const conteudoMarkdown = this.htmlParaMarkdown(checklist);
    
    navigator.clipboard.writeText(conteudoMarkdown).then(() => {
      this.mostrarToast('✅ Checklist copiado! Cole no ZigChat.');
      logger.log('COPY_CHECKLIST', { caracteres: conteudoMarkdown.length });
    }).catch(err => {
      console.error('Erro ao copiar:', err);
      logger.log('COPY_ERROR', { erro: err.message });
    });
  }

  /**
   * Toast de confirmação no rodapé da tela
   */
  static mostrarToast(mensagem) {
    const toast = document.createElement('div');
    toast.className = 'toast';
    toast.textContent = mensagem;
    document.body.appendChild(toast);
    
    setTimeout(() => {
      toast.style.animation = 'slideUp 0.3s ease reverse';
      setTimeout(() => toast.remove(), 300);
    }, 2000);
  }
}

// ═══════════════════════════════════════════════════════════════════════
//  UTIL — PROCESSAMENTO INTELIGENTE DE DADOS
// ═══════════════════════════════════════════════════════════════════════
function normalizeText(str) {
  if (!str) return '';
  return str
    .normalize('NFD')
    .replace(/[\u0300-\u036f]/g, '')
    .toUpperCase()
    .trim();
}

/**
 * Interpretador Avançado de Datas (Padrão Brasil)
 * Trata entradas coloquiais do WhatsApp como: 
 * "240477", "24-04-77", "24.4.77", "24 04 1977", "24/4/77"
 */
function interpretarEValidarDataBr(txt) {
  if (!txt) return null;
  
  // Substitui separadores comuns (ponto, traço, espaço) por barra
  let limpo = txt.trim().replace(/[-.\s]+/g, '/');
  
  // Caso o usuário tenha digitado apenas números
  if (!limpo.includes('/')) {
    let num = limpo.replace(/\D/g, '');
    if (num.length === 6) { // DDMMYY
      limpo = `${num.substring(0, 2)}/${num.substring(2, 4)}/${num.substring(4, 6)}`;
    } else if (num.length === 8) { // DDMMYYYY
      limpo = `${num.substring(0, 2)}/${num.substring(2, 4)}/${num.substring(4, 8)}`;
    }
  }

  const partes = limpo.split('/');
  if (partes.length !== 3) return null;

  let dia = parseInt(partes[0], 10);
  let mes = parseInt(partes[1], 10);
  let anoStr = partes[2].replace(/\D/g, '');
  let ano = parseInt(anoStr, 10);

  if (isNaN(dia) || isNaN(mes) || isNaN(ano)) return null;

  // Ajuste inteligente para anos com 2 dígitos (Padrão Brasil - Limiar em 2026)
  if (anoStr.length === 2) {
    if (ano <= 26) {
      ano += 2000;
    } else {
      ano += 1900;
    }
  }

  // Validação real de calendário da data gerada
  const dataTeste = new Date(ano, mes - 1, dia);
  if (dataTeste.getFullYear() !== ano || dataTeste.getMonth() !== mes - 1 || dataTeste.getDate() !== dia) {
    logger.log('DATE_VALIDATION_FAILED', { entrada: txt, motivo: 'data inválida' });
    return null;
  }

  const hoje = new Date();
  if (dataTeste > hoje || ano < 1900) {
    logger.log('DATE_VALIDATION_FAILED', { entrada: txt, motivo: 'data futura ou ano inválido' });
    return null;
  }

  const diaPadrao = String(dia).padStart(2, '0');
  const mesPadrao = String(mes).padStart(2, '0');
  
  const idade = hoje.getFullYear() - dataTeste.getFullYear() - 
    ((hoje.getMonth() < dataTeste.getMonth() || 
    (hoje.getMonth() === dataTeste.getMonth() && hoje.getDate() < dataTeste.getDate())) ? 1 : 0);
  
  logger.log('DATE_VALIDATION_SUCCESS', { dataFormatada: `${diaPadrao}/${mesPadrao}/${ano}`, idade });
  
  return {
    dataFormatada: `${diaPadrao}/${mesPadrao}/${ano}`,
    idade: idade
  };
}

function validarPreferenciaData(txt) {
  if (!txt || txt.trim().length < 3) return false;
  const t = txt.toLowerCase();
  const temData      = /\d{1,2}\/\d{1,2}/.test(t) || /\d{1,2}h/.test(t);
  const temDiaSemana = /(segunda|terça|terca|quarta|quinta|sexta|sábado|sabado|domingo)/.test(t);
  const temPeriodo   = /(manhã|manha|tarde|noite|cedo|hoje|amanhã|amanha|próxim|proxim|semana|dia)/.test(t);
  return temData || temDiaSemana || temPeriodo;
}

function addBotBubble(html, delay = 0) {
  return new Promise(resolve => {
    setTimeout(() => {
      const row = document.createElement('div');
      row.className = 'msg-row bot';
      row.innerHTML = `<div class="bubble">${html}</div><div class="bubble-time">${now()}</div>`;
      
      // Adiciona funcionalidade de cópia ao hover
      row.addEventListener('click', (e) => {
        if (e.target.textContent === '📋' || e.currentTarget.querySelector('.bubble:hover')) {
          CopyFormatter.copiarBolhaFormatada(row);
        }
      });

      chat().appendChild(row); 
      scrollBottom(); 
      resolve();
    }, delay);
  });
}

function addUserBubble(text) {
  const row = document.createElement('div');
  row.className = 'msg-row user';
  row.innerHTML = `<div class="bubble">${text}</div><div class="bubble-time">${now()} <span class="check-icon">✓✓</span></div>`;
  chat().appendChild(row); 
  scrollBottom();
  logger.log('USER_INPUT', { texto: text.substring(0, 50) });
}

function addOptions(opts, delay = 0) {
  return new Promise(resolve => {
    setTimeout(() => {
      const wrap = document.createElement('div');
      wrap.className = 'options-wrap';
      opts.forEach((o, idx) => {
        const btn = document.createElement('button');
        btn.className = 'opt-btn default';
        if (o.label.includes('Sim') || o.label.includes('corretos')) btn.className = 'opt-btn verde';
        if (o.label.includes('Não') || o.label.includes('corrigir')) btn.className = 'opt-btn vermelho';
        if (o.label.includes('Atendente') || o.label.includes('Falar') || o.label.includes('Retornar')) btn.className = 'opt-btn azul';
        
        btn.innerHTML = o.label;
        btn.onclick = () => {
          wrap.querySelectorAll('.opt-btn').forEach(b => { b.disabled = true; b.style.opacity = '0.5'; });
          addUserBubble(o.label);
          logger.log('OPTION_SELECTED', { opcao: o.label, indice: idx });
          o.action();
        };
        wrap.appendChild(btn);
      });
      chat().appendChild(wrap); 
      scrollBottom(); 
      resolve();
    }, delay);
  });
}

function showTyping(ms = 1000) {
  return new Promise(resolve => {
    const row = document.createElement('div');
    row.className = 'typing-row'; 
    row.id = 'typingRow';
    row.innerHTML = `<div class="typing-bubble"><div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div></div>`;
    chat().appendChild(row); 
    scrollBottom();
    setTimeout(() => { const el = getEl('typingRow'); if(el) el.remove(); resolve(); }, ms);
  });
}

function enableInput(ph = 'Digite sua resposta...', type = 'text') {
  const inp = getEl('userInput');
  inp.disabled = false; 
  inp.placeholder = ph; 
  inp.focus();
  
  if(type === 'numeric') {
    inp.setAttribute('inputmode', 'numeric');
  } else {
    inp.removeAttribute('inputmode');
  }
  state.aguardandoTexto = true;
  logger.log('INPUT_ENABLED', { placeholder: ph, tipo: type });
}

function disableInput() {
  const inp = getEl('userInput');
  inp.disabled = true; 
  inp.placeholder = 'Escolha uma opção acima';
  inp.removeAttribute('inputmode');
  state.aguardandoTexto = false;
}

getEl('userInput').addEventListener('input', function() {
  this.style.height = 'auto'; 
  this.style.height = this.scrollHeight + 'px';
});

function sendMessage() {
  if (!state.aguardandoTexto) return;
  const inp = getEl('userInput');
  const txt = inp.value.trim(); 
  if (!txt) return;
  inp.value = ''; 
  inp.style.height = 'auto';
  disableInput(); 
  addUserBubble(txt); 
  handleTextInput(txt);
}

getEl('userInput').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { 
    e.preventDefault(); 
    sendMessage(); 
  }
});

//  TEXT ROUTER (MÁQUINA DE ESTADOS)
// ═══════════════════════════════════════════════════════════════════════
async function handleTextInput(txt) {
  if (/atendente|humano|pessoa/i.test(txt)) {
    await showTyping(700); 
    await falarComAtendente(); 
    return;
  }
  await showTyping(900);

  switch(state.step) {

    case 'COL_NOME':
      state.dados.nome = normalizeText(txt);
      state.step = 'COL_NASCIMENTO';
      await addBotBubble('📅 [Passo 2 de 5] <b>Qual a Data de Nascimento do paciente?</b><br><i>Ex: Pode digitar livremente (240477, 24/04/1977, 24.4.77)</i>');
      enableInput('Ex: 24/04/1977');
      break;

    case 'COL_NASCIMENTO':
      const dataInterpretada = interpretarEValidarDataBr(txt);
      if (dataInterpretada === null) {
        await addBotBubble('⚠️ <b>Data inválida ou não reconhecida!</b><br>Por favor, informe uma data real e existente (Ex: 24/04/1977 ou 240477).');
        enableInput('Tente novamente...');
        break;
      }
      
      state.dados.nascimento = dataInterpretada.dataFormatada;
      state.dados.idade = dataInterpretada.idade;

      if (cfgFluxo().tipo === 'OPERACAO') {
        await buscarAgendamentoExistente();
        break;
      }

      state.step = 'COL_PARA_QUEM';
      await addBotBubble('🙋 [Passo 3 de 5] <b>Esta consulta é para você mesmo(a)?</b>');
      await addOptions([
        { label: '1️⃣ Sim, sou eu mesmo(a)',     action: () => setParaQuem('O MESMO') },
        { label: '2️⃣ Não, é para outra pessoa', action: pedirNomeResponsavel },
      ], 150);
      break;

    case 'COL_RESPONSAVEL_NOME':
      state.dados.responsavel = normalizeText(txt);
      await perguntarConvenio();
      break;

    case 'COL_CONVENIO_NOME':
      state.dados.convenio = normalizeText(txt);
      await perguntarMedico();
      break;

    case 'COL_MEDICO_NOME':
      state.dados.medico = normalizeText(txt);
      await aposColetaBase();
      break;

    case 'RMK_PREF_DATA':
      if (!validarPreferenciaData(txt)) {
        await addBotBubble('⚠️ Não consegui interpretar o período informado. Tente algo claro como: <i>"próxima terça à tarde"</i> ou <i>"25/11 de manhã"</i>.');
        enableInput('Ex: Terça à tarde...');
        break;
      }
      state.dados.preferencia_nova_data = txt;
      await exibirChecklist();
      break;

    case 'CONF_DATA':
      if (!validarPreferenciaData(txt)) {
        await addBotBubble('⚠️ Não consegui compreender o horário informado. Tente algo como: <i>"sexta às 10h"</i> ou uma data estimada.');
        enableInput('Ex: Sexta-feira às 10h...');
        break;
      }
      state.dados.data_confirmar = txt;
      await exibirChecklist();
      break;

    case 'CAN_MOTIVO_OUTRO':
      state.dados.motivo_cancelamento = normalizeText(txt);
      await exibirChecklist();
      break;

    case 'BUSCA_NOME_MANUAL':
      state.dados.nome_manual = normalizeText(txt);
      await addBotBubble('🔍 Buscando registros no banco institucional...');
      await showTyping(1200);
      await addBotBubble('⚠️ Nenhum registro prévio foi indexado de forma automatizada com este nome.<br>Nossa equipe humana fará a validação manual.');
      await falarComAtendente();
      break;

    default:
      await addBotBubble('Desculpe, comando não reconhecido pelo sistema de triagem. Por favor, utilize as interações de menu. 😊');
      await mostrarMenuAgendamento(300);
  }
}

    { label: '▶️ 01 — Urologia',                     action: () => setEsp('Urologia', '▶️ 01 — Urologia') },
    { label: '▶️ 02 — Ortopedia',                    action: () => setEsp('Ortopedia', '▶️ 02 — Ortopedia') },
    { label: '▶️ 03 — Clínico-Geral / Saúde Mental', action: () => setEsp('Clínico-Geral (Saúde Mental)', '▶️ 03 — Clínico-Geral / Saúde Mental') },
    { label: '▶️ 04 — Oncologia',                    action: () => setEsp('Oncologia', '▶️ 04 — Oncologia') },
    { label: '▶️ 05 — Cirurgião Vascular',           action: () => setEsp('Cirurgião Vascular', '▶️ 05 — Cirurgião Vascular') },
    { label: '▶️ 06 — Pediatra',                     action: () => setEsp('Pediatra', '▶️ 06 — Pediatra') },
    { label: '▶️ 07 — Cardiologista',                action: () => setEsp('Cardiologia', '▶️ 07 — Cardiologista') },
    { label: '▶️ 08 — Cirurgião Geral e Gastro',    action: () => setEsp('Cirurgião Geral e Gastro', '▶️ 08 — Cirurgião Geral e Gastro') },
    { label: '▶️ 09 — Cirurgião Cabeça e Pescoço',  action: () => setEsp('Cirurgião Cabeça e Pescoço', '▶️ 09 — Cirurgião Cabeça e Pescoço') },
    { label: '▶️ 10 — Proctologista',               action: () => setEsp('Proctologista', '▶️ 10 — Proctologista') },
    { label: '▶️ 11 — Dermatologista',              action: () => setEsp('Dermatologista', '▶️ 11— Dermatologista') },
    { label: '▶️ 12 — Gastro',                      action: () => setEsp('Gastro', '▶️ 12 — Gastro') },
    { label: '🔙 Voltar ao Menu Principal',          action: voltarAgendamento },
  ], 200);
  logger.log('FLUXO_ESPECIALIDADE', { origem });
}

async function setEsp(internal, label) {
  state.dados.especialidade = internal;
  state.dados.especialidade_label = label;
  await iniciarColeta(state.origemFluxo, internal, label);
}

async function aposColetaBase() {
  const cfg = cfgFluxo();
  if (state.origemFluxo === 'CANCELAR') {
    await perguntarMotivoCancelamento();
    return;
  }
  if (cfg.tipo === 'OPERACAO' && cfg.proximoStep) {
    state.step = cfg.proximoStep;
    await showTyping(600);
    await addBotBubble(cfg.msgData);
    enableInput(cfg.phData);
    return;
  }
  await exibirChecklist();
}

async function perguntarMotivoCancelamento() {
  await showTyping(600);
  await addBotBubble('Para fins de controle de qualidade institucional, indique o <b>motivo do cancelamento</b>:');
  await addOptions([
    { label: '1️⃣ Imprevisto Pessoal',      action: async () => { state.dados.motivo_cancelamento = 'IMPREVISTO PESSOAL';      await exibirChecklist(); } },
    { label: '2️⃣ Já resolvi a demanda',    action: async () => { state.dados.motivo_cancelamento = 'JA RESOLVI A DEMANDA';    await exibirChecklist(); } },
    { label: '3️⃣ Tempo de espera na unidade', action: async () => { state.dados.motivo_cancelamento = 'TEMPO DE ESPERA';        await exibirChecklist(); } },
    { label: '4️⃣ Outros motivos',          action: async () => { state.step = 'CAN_MOTIVO_OUTRO'; await addBotBubble('Descreva resumidamente o motivo de cancelamento:'); enableInput('Motivo...'); } },
  ], 150);
}

// ═══════════════════════════════════════════════════════════════════════
//  FLUXO EXCLUSIVO 5 — SETOR DE CARDIOLOGIA
// ═══════════════════════════════════════════════════════════════════════
async function fluxoCardiologia() {
  state.origemFluxo = 'CARDIOLOGIA';
  state.dados.especialidade = 'Exames Cardiológicos';
  state.dados.especialidade_label = '🫀 Exames Cardiológicos (setor exclusivo)';
  await showTyping(900);
  await addBotBubble(
    '🫀 <b>Agendamento de Exames e Procedimentos Cardiológicos</b><div class="info-box">' +
    'Os procedimentos diagnósticos (Eletrocardiograma, Holter, MAPA, Ecocardiograma) são processados por uma <b>agenda técnica distinta e exclusiva</b> da consulta médica convencional.<br><br>' +
    '📍 Unidade física localizada anexa ao <b>Ambulatório Central</b>.<br>' +
    '💡 Caso queira agendar apenas uma consulta de rotina com o médico cardiologista clínico, retorne e escolha a opção correspondente.' +
    '</div>'
  );
  await showTyping(700);
  await iniciarColeta('CARDIOLOGIA', state.dados.especialidade, state.dados.especialidade_label);
}

async function falarComAtendente() {
  await showTyping(800);
  await addBotBubble(
    '🗣️ <b>Chamando Operador Humano...</b><br><br>' +
    'Aguarde na linha enquanto notificamos um profissional disponível na mesa de atendimento. O histórico da nossa conversa foi anexado. 😊'
  );
  logger.log('ATENDENTE_CHAMADO', { timestamp: new Date().toISOString() });
}

async function voltarAgendamento() {
  state.dados = {};
  await showTyping(500);
  await addBotBubble('Retornando ao menu inicial de Agendamentos...');
  await mostrarMenuAgendamento(400);
  logger.log('VOLTAR_MENU', { origem: 'agendamento' });
}

async function voltarMenuPrincipal() {
  state.dados = {};
  await showTyping(600);
  await addBotBubble(
    '🔙 <b>Menu Institucional Geral</b><br><br>' +
    'Selecione o departamento integrado que deseja contatar no Hospital Marcx:<br><br>' +
    '<div class="info-box">' +
    '1️⃣ Atendimento Geral ao Cliente<br>' +
    '2️⃣ Agendamentos / Triagens<br>' +
    '3️⃣ Resultados de Exames Clínicos<br>' +
    '4️⃣ Tesouraria / Caixa Central<br>' +
    '5️⃣ Orçamentos e Faturamento<br>' +
    '6️⃣ Recrutamento e Seleção (RH)<br>' +
    '7️⃣ Manual de Internação e Visitas<br>' +
    '8️⃣ Ouvidoria' +
    '</div>'
  );
  await addOptions([
    { label: '2️⃣ Retornar a Agendamentos', action: voltarAgendamento },
    { label: '8️⃣ Direcionar a Ouvidoria',  action: async () => { await showTyping(500); await addBotBubble('Acionando painel da Ouvidoria Hospitalar... 🏥'); logger.log('OUVIDORIA_ACIONADA'); } },
  ], 300);
}

window.onload = () => setTimeout(iniciarBot, 700);
</script>
