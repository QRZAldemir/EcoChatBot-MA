<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agendamento — Hospital Presbiteriano Mackenzie</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    /* ┏━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┓
       ┃ Core Colors — Cores Institucionais ┃
       ┗━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┛ */
    --mac-red:       #c8102e;
    --mac-red-dark:  #a00d24;
    --mac-red-light: #e8102e;
    --mac-red-pale:  #fff5f6;
    --mac-red-hover: #ffe0e4;
    
    /* ┏━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┓
       ┃ Secondary Colors — Cores Secundárias ┃
       ┗━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┛ */
    --green:         #25a244;
    --green-pale:    #f0fff4;
    --green-dark:    #1a7a33;
    
    --blue:          #1565c0;
    --blue-pale:     #e8f0fe;
    --blue-dark:     #0d47a1;
    
    --yellow:        #e6a817;
    --yellow-pale:   #fffbea;
    --yellow-dark:   #b07d0a;
    
    --purple:        #7b1fa2;
    --purple-pale:   #f9f0ff;
    --purple-dark:   #4a0072;
    
    /* ┏━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┓
       ┃ Chat & WhatsApp Theme — Tema Chat ┃
       ┗━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┛ */
    --wa-bg:         #f0ece8;
    --bubble-bot:    #ffffff;
    --bubble-user:   #ffd6d9;
    --wa-text:       #111b21;
    --wa-meta:       #667781;
    
    /* ┏━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┓
       ┃ Typography — Tipografia ┃
       ┗━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┛ */
    --font: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  }

  body {
    font-family: var(--font);
    background: #cfc8c4;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
  }

  .phone-wrap {
    width: 100%;
    max-width: 420px;
    height: 90vh;
    max-height: 820px;
    background: #111;
    border-radius: 40px;
    padding: 10px;
    box-shadow: 0 30px 80px rgba(0,0,0,0.55), inset 0 0 0 2px #2a2a2a;
    display: flex;
    flex-direction: column;
  }

  .screen {
    flex: 1; background: var(--wa-bg);
    border-radius: 32px; overflow: hidden;
    display: flex; flex-direction: column;
  }

  /* ── Header ── */
  .header {
    background: var(--mac-red);
    padding: 10px 14px 10px 12px;
    display: flex; align-items: center; gap: 10px;
    flex-shrink: 0;
    box-shadow: 0 2px 6px rgba(0,0,0,0.25);
  }
  .mac-logo {
    width: 42px; height: 42px; border-radius: 50%;
    background: #fff; display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; border: 2.5px solid rgba(255,255,255,0.45);
  }
  .mac-logo-ring {
    width: 34px; height: 34px; border-radius: 50%;
    border: 3px solid var(--mac-red);
    display: flex; align-items: center; justify-content: center;
  }
  .mac-logo-ring span {
    font-family: 'Times New Roman', Georgia, serif;
    font-size: 19px; font-weight: 900; color: var(--mac-red);
    line-height: 1; margin-top: 1px;
  }
  .header-info { flex: 1; min-width: 0; }
  .header-name {
    color: #fff; font-weight: 700; font-size: 12.5px;
    line-height: 1.25; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis;
  }
  .header-sub  { color: rgba(255,255,255,0.75); font-size: 10px; line-height: 1.2; margin-top: 1px; }
  .header-status { color: rgba(255,255,255,0.62); font-size: 10.5px; margin-top: 2px; }
  .header-actions { display: flex; gap: 16px; flex-shrink: 0; }
  .header-actions svg { width: 20px; height: 20px; fill: rgba(255,255,255,0.85); cursor: pointer; }

  /* ── Chat ── */
  .chat-area {
    flex: 1; overflow-y: auto;
    padding: 12px 10px;
    display: flex; flex-direction: column; gap: 3px;
    scroll-behavior: smooth;
    background-image: url("data:image/svg+xml,%3Csvg width='52' height='52' viewBox='0 0 52 52' xmlns='http://www.w3.org/2000/svg'%3E%3Ccircle cx='26' cy='26' r='11' fill='none' stroke='%23c8102e' stroke-width='1' stroke-opacity='0.055'/%3E%3C/svg%3E");
  }
  .chat-area::-webkit-scrollbar { width: 4px; }
  .chat-area::-webkit-scrollbar-thumb { background: rgba(200,16,46,0.18); border-radius: 2px; }

  .date-divider { text-align: center; margin: 8px 0; }
  .date-divider span {
    background: rgba(255,255,255,0.88); color: var(--wa-meta);
    font-size: 11.5px; padding: 4px 12px;
    border-radius: 8px; box-shadow: 0 1px 2px rgba(0,0,0,0.1);
  }

  /* ── Bubbles ── */
  .msg-row { display: flex; flex-direction: column; margin-bottom: 2px; }
  .msg-row.bot  { align-items: flex-start; }
  .msg-row.user { align-items: flex-end; }
  .bubble {
    max-width: 85%; padding: 8px 11px 6px;
    border-radius: 8px; font-size: 14px; line-height: 1.5;
    color: var(--wa-text); word-break: break-word;
    box-shadow: 0 1px 2px rgba(0,0,0,0.12);
    opacity: 0; transform: translateY(6px);
    animation: fadeUp 0.25s ease forwards;
  }
  @keyframes fadeUp { to { opacity: 1; transform: translateY(0); } }
  .msg-row.bot  .bubble { background: var(--bubble-bot);  border-top-left-radius: 2px; }
  .msg-row.user .bubble { background: var(--bubble-user); border-top-right-radius: 2px; }
  .bubble-time {
    font-size: 10.5px; color: var(--wa-meta);
    margin-top: 2px; display: flex; align-items: center; gap: 3px;
  }
  .msg-row.user .bubble-time { justify-content: flex-end; }
  .check-icon { color: var(--mac-red); font-size: 12px; }

  /* ── Typing ── */
  .typing-row { display: flex; align-items: flex-start; margin-bottom: 4px; }
  .typing-bubble {
    background: var(--bubble-bot); border-radius: 8px; border-top-left-radius: 2px;
    padding: 12px 14px; box-shadow: 0 1px 2px rgba(0,0,0,0.1);
    display: flex; gap: 5px; align-items: center;
  }
  .typing-dot {
    width: 7px; height: 7px; background: #ccc; border-radius: 50%;
    animation: bounce 1.2s infinite;
  }
  .typing-dot:nth-child(2) { animation-delay: 0.2s; }
  .typing-dot:nth-child(3) { animation-delay: 0.4s; }
  @keyframes bounce {
    0%,80%,100% { transform: translateY(0); background: #ccc; }
    40%         { transform: translateY(-5px); background: var(--mac-red); }
  }

  /* ═══════════════════════════════════════════ */
  /* ► BOTÕES COM CORES — INTERACTIVE BUTTON STYLES */
  /* ═══════════════════════════════════════════ */
  
  /* Wrapper dos botões — centraliza e anima o grupo */
  .options-wrap {
    display: flex; flex-direction: column; gap: 5px;
    margin-top: 4px; opacity: 0;
    animation: fadeUp 0.3s ease 0.1s forwards;
  }
  
  /* Estilo base para todos os botões */
  .opt-btn {
    padding: 9px 14px; border-radius: 20px;
    font-size: 13.5px; font-family: var(--font); font-weight: 500;
    border: 1.5px solid; cursor: pointer; text-align: left;
    transition: background 0.15s, transform 0.1s, border-color 0.15s;
    line-height: 1.3;
  }
  .opt-btn:active { transform: scale(0.98); }
  .opt-btn:disabled { opacity: 0.42; pointer-events: none; }
  
  /* ► VERDE — para ações confirmativas (OK, Continuar, Sim) */
  .opt-btn.verde {
    background: var(--green-pale);
    border-color: var(--green);
    color: var(--green-dark);
  }
  .opt-btn.verde:hover { background: #d4f5de; transform: scale(1.01); }
  
  /* ► AZUL — para ações informativas (Consultar, Ver, Info) */
  .opt-btn.azul {
    background: var(--blue-pale);
    border-color: var(--blue);
    color: var(--blue-dark);
  }
  .opt-btn.azul:hover { background: #c3d8fd; transform: scale(1.01); }
  
  /* ► VERMELHO — para ações críticas ou cancelar (Cancelar, Não, Deletar) */
  .opt-btn.vermelho {
    background: var(--mac-red-pale);
    border-color: var(--mac-red);
    color: var(--mac-red-dark);
  }
  .opt-btn.vermelho:hover { background: var(--mac-red-hover); transform: scale(1.01); }
  
  /* ► AMARELO — para ações de aviso (Atenção, Cuidado, Alerta) */
  .opt-btn.amarelo {
    background: var(--yellow-pale);
    border-color: var(--yellow);
    color: var(--yellow-dark);
  }
  .opt-btn.amarelo:hover { background: #fff0c2; transform: scale(1.01); }
  
  /* ► ROXO — para ações especiais ou secundárias (Mais Opções, Especial) */
  .opt-btn.roxo {
    background: var(--purple-pale);
    border-color: var(--purple);
    color: var(--purple-dark);
  }
  .opt-btn.roxo:hover { background: #edd9f7; transform: scale(1.01); }
  
  /* ► DEFAULT — estilo padrão (vermelho) */
  .opt-btn.default {
    background: var(--mac-red-pale);
    border-color: var(--mac-red);
    color: var(--mac-red-dark);
  }
  .opt-btn.default:hover { background: var(--mac-red-hover); transform: scale(1.01); }

  /* ── Checklist card ── */
  .checklist-card {
    background: linear-gradient(135deg, var(--mac-red-dark), var(--mac-red-light));
    color: #fff; border-radius: 14px;
    padding: 14px 16px; margin-top: 8px;
    font-size: 13.5px; line-height: 1.85;
    box-shadow: 0 4px 14px rgba(200,16,46,0.38);
  }
  .checklist-card .card-title {
    font-size: 14px; font-weight: 700; margin-bottom: 8px;
    border-bottom: 1px solid rgba(255,255,255,0.3);
    padding-bottom: 6px;
  }
  .checklist-card .row b   { font-weight: 700; }
  .checklist-card .row span { opacity: 0.88; }

  /* ── Info box ── */
  .info-box {
    background: #fff8f8;
    border-left: 3px solid var(--mac-red);
    border-radius: 0 6px 6px 0;
    padding: 10px 12px; margin-top: 6px;
    font-size: 13px; line-height: 1.6; color: #333;
  }
  .info-box b { color: var(--mac-red-dark); }

  /* ── Input ── */
  .input-area {
    background: #ede8e4; padding: 8px 10px;
    display: flex; align-items: flex-end; gap: 8px;
    flex-shrink: 0; border-top: 1px solid #ddd;
  }
  .input-box-wrap {
    flex: 1; background: #fff; border-radius: 22px;
    display: flex; align-items: flex-end;
    padding: 6px 14px; gap: 8px;
    box-shadow: 0 1px 2px rgba(0,0,0,0.08);
  }
  .input-emoji { font-size: 20px; cursor: pointer; line-height: 1; padding-bottom: 1px; }
  #userInput {
    flex: 1; border: none; outline: none;
    font-family: var(--font); font-size: 14.5px;
    color: var(--wa-text); resize: none;
    max-height: 100px; background: transparent;
    line-height: 1.45; padding: 0;
  }
  #userInput::placeholder { color: #bbb; }
  .attach-icon { font-size: 20px; cursor: pointer; opacity: 0.45; }
  .send-btn {
    width: 46px; height: 46px; background: var(--mac-red);
    border: none; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; flex-shrink: 0;
    transition: background 0.15s, transform 0.1s;
    box-shadow: 0 2px 8px rgba(200,16,46,0.45);
  }
  .send-btn:hover  { background: var(--mac-red-dark); transform: scale(1.05); }
  .send-btn:active { transform: scale(0.95); }
  .send-btn svg { width: 22px; height: 22px; fill: #fff; }
</style>
</head>
<body>

<div class="phone-wrap">
  <div class="screen">

    <div class="header">
      <div class="mac-logo">
        <div class="mac-logo-ring"><span>M</span></div>
      </div>
      <div class="header-info">
        <div class="header-name">Agendamento — H. P. Mackenzie</div>
        <div class="header-sub">Dr. e Sra. Goldsby King — Dourados/MS</div>
        <div class="header-status">● online</div>
      </div>
      <div class="header-actions">
        <svg viewBox="0 0 24 24"><path d="M15.9 14.3H15l-.3-.3c1-1.1 1.6-2.7 1.6-4.3 0-3.7-3-6.7-6.7-6.7S3 5.9 3 9.7s3 6.7 6.7 6.7c1.6 0 3.1-.6 4.3-1.6l.3.3v.8l5.1 5.1 1.5-1.5-5-5.2zm-6.2 0C7 14.3 4.7 12 4.7 9.2S7 4.1 9.7 4.1s5.1 2.3 5.1 5.1-2.3 5.1-5.1 5.1z"/></svg>
        <svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="12" cy="19" r="1.5"/></svg>
      </div>
    </div>

    <div class="chat-area" id="chatArea">
      <div class="date-divider"><span>Hoje</span></div>
    </div>

    <div class="input-area">
      <div class="input-box-wrap">
        <span class="input-emoji">😊</span>
        <textarea id="userInput" rows="1" placeholder="Escolha uma opção acima" disabled></textarea>
        <span class="attach-icon">📎</span>
      </div>
      <button class="send-btn" onclick="sendMessage()">
        <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
      </button>
    </div>

  </div>
</div>

<script>
// ═══════════════════════════════════════════════
//  UTIL — NORMALIZAÇÃO (MAIÚSCULA + SEM ACENTOS)
// ═══════════════════════════════════════════════
function normalizeText(str) {
  if (!str) return '';
  return str
    .normalize('NFD')
    .replace(/[\u0300-\u036f]/g, '')
    .toUpperCase()
    .trim();
}

function calcularIdade(dataNascimento){
  if(!dataNascimento||!/^\d{2}\/\d{2}\/\d{4}$/.test(dataNascimento))return null;
  const [dia,mes,ano]=dataNascimento.split('/').map(Number);
  const hoje=new Date();
  const dataNasc=new Date(ano,mes-1,dia);
  let idade=hoje.getFullYear()-dataNasc.getFullYear();
  const mesAtual=hoje.getMonth();
  const diaAtual=hoje.getDate();
  if(mesAtual<mes-1||(mesAtual===mes-1&&diaAtual<dia))idade--;
  return idade>0?idade:null;
}

// ═══════════════════════════════════════════════
//  STATE
// ═══════════════════════════════════════════════
const state = {
  step: '',
  dados: {},
  aguardandoTexto: false,
  origemFluxo: '' // qual menu iniciou a coleta
};

// ═══════════════════════════════════════════════
//  UTILS
// ═══════════════════════════════════════════════
const now   = () => new Date().toLocaleTimeString('pt-BR', { hour:'2-digit', minute:'2-digit' });
const chat  = () => document.getElementById('chatArea');
const getEl = id  => document.getElementById(id);

// Novo formato de protocolo: HPM-YYYYMMDD-NNNN
function gerarProtocolo() {
  const d = new Date();
  const ano = d.getFullYear();
  const mes = String(d.getMonth() + 1).padStart(2, '0');
  const dia = String(d.getDate()).padStart(2, '0');
  const dataStr = `${ano}${mes}${dia}`;
  const aleatorio = Math.floor(1000 + Math.random() * 9000); // 4 dígitos
  return `HPM-${dataStr}-${aleatorio}`;
}

function scrollBottom() {
  setTimeout(() => { const c = chat(); c.scrollTop = c.scrollHeight; }, 60);
}

// ═══════════════════════════════════════════════
//  RENDER HELPERS
// ═══════════════════════════════════════════════
function addBotBubble(html, delay = 0) {
  return new Promise(resolve => {
    setTimeout(() => {
      const row = document.createElement('div');
      row.className = 'msg-row bot';
      row.innerHTML = `<div class="bubble">${html}</div><div class="bubble-time">${now()}</div>`;
      chat().appendChild(row); scrollBottom(); resolve();
    }, delay);
  });
}

function addUserBubble(text) {
  const row = document.createElement('div');
  row.className = 'msg-row user';
  row.innerHTML = `<div class="bubble">${text}</div>
    <div class="bubble-time">${now()} <span class="check-icon">✓✓</span></div>`;
  chat().appendChild(row); scrollBottom();
}

function addOptions(opts, delay = 0) {
  return new Promise(resolve => {
    setTimeout(() => {
      const wrap = document.createElement('div');
      wrap.className = 'options-wrap';
      opts.forEach(o => {
        const btn = document.createElement('button');
        btn.className = 'opt-btn';
        btn.innerHTML = o.label;
        btn.onclick = () => {
          wrap.querySelectorAll('.opt-btn').forEach(b => { b.disabled = true; b.style.opacity = '0.5'; });
          addUserBubble(o.label);
          o.action();
        };
        wrap.appendChild(btn);
      });
      chat().appendChild(wrap); scrollBottom(); resolve();
    }, delay);
  });
}

function showTyping(ms = 1000) {
  return new Promise(resolve => {
    const row = document.createElement('div');
    row.className = 'typing-row'; row.id = 'typingRow';
    row.innerHTML = `<div class="typing-bubble">
      <div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div>
    </div>`;
    chat().appendChild(row); scrollBottom();
    setTimeout(() => { const el = getEl('typingRow'); if(el) el.remove(); resolve(); }, ms);
  });
}

function enableInput(ph = 'Digite sua resposta...') {
  const inp = getEl('userInput');
  inp.disabled = false; inp.placeholder = ph; inp.focus();
  state.aguardandoTexto = true;
}

function disableInput() {
  const inp = getEl('userInput');
  inp.disabled = true; inp.placeholder = 'Escolha uma opção acima';
  state.aguardandoTexto = false;
}

// ═══════════════════════════════════════════════
//  SEND
// ═══════════════════════════════════════════════
function sendMessage() {
  if (!state.aguardandoTexto) return;
  const inp = getEl('userInput');
  const txt = inp.value.trim(); if (!txt) return;
  inp.value = ''; inp.style.height = 'auto';
  disableInput(); addUserBubble(txt); handleTextInput(txt);
}
getEl('userInput').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
});
getEl('userInput').addEventListener('input', function() {
  this.style.height = 'auto'; this.style.height = this.scrollHeight + 'px';
});

// ═══════════════════════════════════════════════
//  TEXT ROUTER
// ═══════════════════════════════════════════════
async function handleTextInput(txt) {
  if (/atendente|humano|pessoa/i.test(txt)) {
    await showTyping(700); await falarComAtendente(); return;
  }
  await showTyping(900);

  switch(state.step) {

    // ── COLETA PASSO 1 — NOME ─────────────────
    case 'COL_NOME':
      state.dados.nome = normalizeText(txt);
      state.step = 'COL_NASCIMENTO';
      await addBotBubble('📅 <b>2. Qual a Data de Nascimento?</b><br><i>Ex: 15/03/1990</i>');
      enableInput('Ex: 15/03/1990');
      break;

    // ── COLETA PASSO 2 — NASCIMENTO ───────────
    case 'COL_NASCIMENTO':
      if (!/^\d{2}\/\d{2}\/\d{4}$/.test(txt)) {
        await addBotBubble('⚠️ Esse dado é inválido para informar a data de nascimento. Por favor, use o formato DD/MM/AAAA (ex: 12/02/1999).');
        enableInput('Ex: 12/02/1999');
        break;
      }
      state.dados.nascimento = txt; // mantém formato original
      const idade = calcularIdade(txt);
      if(idade) state.dados.idade = idade;
      state.step = 'COL_PARA_QUEM';
      await addBotBubble('🙋 <b>3. Essa consulta é para você?</b>');
      await addOptions([
        { label: '1️⃣ Sim, sou eu mesmo(a)',     action: () => setParaQuem('O MESMO') },
        { label: '2️⃣ Não, é para outra pessoa', action: pedirNomeResponsavel },
      ], 150);
      break;

    // ── COLETA — NOME DO RESPONSÁVEL ──────────
    case 'COL_RESPONSAVEL_NOME':
      state.dados.responsavel = normalizeText(txt);
      await perguntarConvenio();
      break;

    // ── COLETA PASSO 4 — NOME CONVÊNIO ────────
    case 'COL_CONVENIO_NOME':
      state.dados.convenio = normalizeText(txt);
      await perguntarMedico();
      break;

    // ── COLETA PASSO 5 — NOME MÉDICO ──────────
    case 'COL_MEDICO_NOME':
      state.dados.medico = normalizeText(txt);
      await aposColetaBase();
      break;

    case 'RMK_PREF_DATA':
      state.dados.preferencia_nova_data = txt;
      await exibirChecklist();
      break;

    case 'CONF_DATA':
      state.dados.data_confirmar = txt;
      await exibirChecklist();
      break;

    case 'CAN_MOTIVO_OUTRO':
      state.dados.motivo_cancelamento = normalizeText(txt);
      await exibirChecklist();
      break;

    // ── BUSCA NOME MANUAL ─────────────────────
    case 'BUSCA_NOME_MANUAL':
      state.dados.nome_manual = normalizeText(txt);
      await addBotBubble('🔍 Buscando pelo nome informado...');
      await showTyping(1200);
      await addBotBubble('⚠️ Não localizamos agendamentos para o nome informado.<br>Um atendente vai te ajudar a verificar manualmente.');
      await falarComAtendente();
      break;

    default:
      await addBotBubble('Desculpe, não entendi. Por favor, escolha uma opção do menu. 😊');
      await mostrarMenuAgendamento(300);
  }
}

// ═══════════════════════════════════════════════
//  BOOT
// ═══════════════════════════════════════════════

// ═══════════════════════════════════════════════
//  MENU AGENDAMENTO
// ═══════════════════════════════════════════════
async function mostrarMenuAgendamento(delay = 400) {
  state.step = 'MENU_AGENDAMENTO';
  state.dados = {};
  disableInput();
  await addOptions([
    { label: '1️⃣ 📋 Marcar Consulta',           action: () => fluxoSelecionarEspecialidade('MARCAR') },
    { label: '2️⃣ 🔍 Confirmar meu Agendamento',  action: () => fluxoSelecionarEspecialidade('CONFIRMAR') },
    { label: '3️⃣ 🔄 Remarcar Consulta',          action: () => fluxoSelecionarEspecialidade('REMARCAR') },
    { label: '4️⃣ ❌ Cancelar Consulta',          action: () => fluxoSelecionarEspecialidade('CANCELAR') },
    { label: '5️⃣ 🫀 Exames Cardiológicos',       action: fluxoCardiologia },
    { label: '6️⃣ 🗣️ Falar com Atendente',        action: falarComAtendente },
    { label: '7️⃣ 🔙 Retornar ao Menu Principal', action: voltarMenuPrincipal },
  ], delay);
}

// ═══════════════════════════════════════════════
//  COLETA UNIFICADA — Chamada por TODOS os menus
// ═══════════════════════════════════════════════
async function iniciarColeta(origem, especialidade = null, especialidadeLabel = null) {
  state.origemFluxo = origem;
  if (especialidade) state.dados.especialidade = especialidade;
  if (especialidadeLabel) state.dados.especialidade_label = especialidadeLabel;
  // Limpa campos que serão coletados novamente
  delete state.dados.nome;
  delete state.dados.nascimento;
  delete state.dados.responsavel;
  delete state.dados.convenio;
  delete state.dados.medico;

  state.step = 'COL_NOME';
  await showTyping(800);
  await addBotBubble(
    '✅ <b>Perfeito! Para darmos continuidade, vou precisar de algumas informações rápidas.</b> 😊<br><br>' +
    '👤 <b>1. Qual o Nome Completo do paciente?</b>'
  );
  enableInput('Nome completo do paciente...');
}

// ─── Para Quem ───────────────────────────────
function setParaQuem(valor) {
  state.dados.responsavel = valor;
  perguntarConvenio();
}

async function pedirNomeResponsavel() {
  state.step = 'COL_RESPONSAVEL_NOME';
  await showTyping(600);
  await addBotBubble('🙋 Qual o <b>nome de quem está entrando em contato</b>? (responsável pelo agendamento)');

}

// ─── Perg. Convênio ───────────────────────────
async function perguntarConvenio() {
  state.step = 'COL_CONVENIO';
  await showTyping(600);
  await addBotBubble('🏥 <b>4. Possui plano de saúde ou convênio?</b>');

    {
      label: '1️⃣ Sim → informar nome do plano',

      }

    {
      label: '2️⃣ Não → Atendimento Particular',

}

// ─── Perg. Médico ─────────────────────────────
async function perguntarMedico() {
  if (state.origemFluxo === 'CONFIRMAR') {
    state.step = 'COL_MEDICO_NOME';
    await showTyping(600);
    await addBotBubble('👨‍⚕️ <b>Qual o nome do Dr(a) que queira confirmar o seu atendimento?</b>');
    enableInput('Ex: Dr. Carlos Mendes...');
    return;
  } else if (state.origemFluxo === 'REMARCAR') {
    state.step = 'COL_MEDICO_NOME';
    await showTyping(600);
    await addBotBubble('👨‍⚕️ <b>Qual o nome do médico da consulta que você quer remarcar?</b>');
    enableInput('Ex: Dr. Carlos Mendes...');
    return;
  } else if (state.origemFluxo === 'CANCELAR') {
    state.step = 'COL_MEDICO_NOME';
    await showTyping(600);
    await addBotBubble('👨‍⚕️ <b>Qual o nome do médico da consulta que você quer cancelar?</b>');
    enableInput('Ex: Dr. Carlos Mendes...');
    return;
  }

  state.step = 'COL_MEDICO';
  await showTyping(600);
  await addBotBubble('👨‍⚕️ <b>5. Você já é acompanhado por algum médico?</b>');
  await addOptions([
    {
      label: '1️⃣ Sim → informar nome do médico',
      action: () => {
        state.step = 'COL_MEDICO_NOME';
        addBotBubble('👨‍⚕️ Informe o <b>nome do médico</b>, por favor:');
        enableInput('Ex: Dr. Carlos Mendes...');
      }
    },
    {
      label: '2️⃣ Não → Sem acompanhamento médico atual',
      action: async () => { state.dados.medico = 'SEM ACOMPANHAMENTO MEDICO'; await aposColetaBase(); }
    },
  ], 150);
}

// ═══════════════════════════════════════════════
//  CHECKLIST — Confirmação unificada
// ═══════════════════════════════════════════════
async function exibirChecklist() {
  await showTyping(1100);
  const prot = gerarProtocolo(); // novo formato HPM-YYYYMMDD-NNNN
  state.dados.protocolo = prot;

  const labels = {
    MARCAR:      '📋 Marcar Consulta',
    CONFIRMAR:   '🔍 Confirmar Agendamento',
    REMARCAR:    '🔄 Remarcar Consulta',
    CANCELAR:    '❌ Cancelar Consulta',
    CARDIOLOGIA: '🫀 Exames Cardiológicos',
  };

  // Exibe especialidade com o texto do menu se disponível
  const especialidadeDisplay = state.dados.especialidade_label
    ? `${state.dados.especialidade_label}`
    : (state.dados.especialidade ? state.dados.especialidade : 'NÃO INFORMADO');

  const espLinha = state.dados.especialidade
    ? `<div class="row">🩺 <b>Especialidade:</b> <span>${especialidadeDisplay}</span></div>` : '';

  const motivoLinha = state.dados.motivo_cancelamento
    ? `<div class="row">📝 <b>Motivo cancelamento:</b> <span>${state.dados.motivo_cancelamento}</span></div>` : '';

  const reagendLinha = state.dados.preferencia_nova_data
    ? `<div class="row">📅 <b>Nova preferência:</b> <span>${state.dados.preferencia_nova_data}</span></div>` : '';

  const encaixeLinha = state.dados.alvo_encaixe
    ? `<div class="row">🚨 <b>Encaixe urgente:</b> <span>${state.dados.alvo_encaixe}</span></div>` : '';

  const confirmarLinha = state.dados.data_confirmar
    ? `<div class="row">🕐 <b>Data a confirmar:</b> <span>${state.dados.data_confirmar}</span></div>` : '';

  await addBotBubble(
    'Certo! 😊 Recebi os dados que você informou. Antes de transferir, confira se estão corretos:<br>' +
    `<div class="checklist-card">` +
    `<div class="card-title">✅ ${labels[state.origemFluxo] || 'Agendamento'}</div>` +
    `<div class="row">🔖 <b>Protocolo:</b> <span>${prot}</span></div>` +
    `<div class="row">📌 <b>Paciente:</b> <span>${state.dados.nome || 'NÃO INFORMADO'}</span></div>` +
    `<div class="row">📅 <b>Data de Nascimento:</b> <span>${state.dados.nascimento || 'NÃO INFORMADO'}</span></div>` +
    `<div class="row">🎂 <b>Idade:</b> <span>${state.dados.idade ? state.dados.idade + ' anos' : 'NÃO INFORMADO'}</span></div>` +
    espLinha +
    `<div class="row">🏥 <b>Convênio:</b> <span>${state.dados.convenio || 'NÃO INFORMADO'}</span></div>` +
    `<div class="row">🙋 <b>Responsável pelo contato:</b> <span>${state.dados.responsavel || 'O MESMO'}</span></div>` +
    `<div class="row">👨‍⚕️ <b>Médico que acompanha:</b> <span>${state.dados.medico || 'NÃO INFORMADO'}</span></div>` +
    motivoLinha + reagendLinha + confirmarLinha +
    `</div>`
  );

  await showTyping(600);
  await addBotBubble('Os dados estão corretos? ✅');
  await addOptions([
    { label: '✅ Sim, dados corretos — transferir!', action: confirmarETransferir },
    { label: '✏️ Não, quero corrigir os dados',     action: () => iniciarColeta(state.origemFluxo, state.dados.especialidade, state.dados.especialidade_label) },
    { label: '🔙 Voltar ao Menu',                   action: voltarAgendamento },
  ], 200);
}

    '<div class="info-box verde">' +

    'Um de nossos colaboradores irá finalizar seu agendamento em breve.' +

// ═══════════════════════════════════════════════
//  SELECIONAR ESPECIALIDADE (UNIFICADO)
// ═══════════════════════════════════════════════
async function fluxoSelecionarEspecialidade(origem) {
  state.origemFluxo = origem;
  await showTyping(900);
  
  let msg = '🩺 <b>Por favor, selecione a Especialidade da consulta:</b>';
  if (origem === 'REMARCAR') {
    msg = '🩺 <b>Qual é a especialidade da consulta que você deseja reagendar?</b>';
  } else if (origem === 'CONFIRMAR') {
    msg = '🩺 <b>Qual é a especialidade para confirmar seu agendamento?</b>';
  } else if (origem === 'CANCELAR') {
    msg = '🩺 <b>Qual é a especialidade da consulta que deseja cancelar?</b>';
  }
  
  await addBotBubble(msg);
  await addOptions([
    { label: '▶️ 1 — Urologia',                    action: () => setEsp('Urologia', '▶️ 1 — Urologia') },
    { label: '▶️ 2 — Ortopedia',                   action: () => setEsp('Ortopedia', '▶️ 2 — Ortopedia') },
    { label: '▶️ 3 — Clínico-Geral / Saúde Mental', action: () => setEsp('Clínico-Geral (Saúde Mental)', '▶️ 3 — Clínico-Geral / Saúde Mental') },
    { label: '▶️ 4 — Reumatologia',                action: () => setEsp('Reumatologia', '▶️ 4 — Reumatologia') },
    { label: '▶️ 5 — Oncologia',                   action: () => setEsp('Oncologia', '▶️ 5 — Oncologia') },
    { label: '▶️ 6 — Otorrinolaringologia',         action: () => setEsp('Otorrinolaringologia', '▶️ 6 — Otorrinolaringologia') },
    { label: '▶️ 7 — Cirurgião Vascular',           action: () => setEsp('Cirurgião Vascular', '▶️ 7 — Cirurgião Vascular') },
    { label: '▶️ 8 — Pediatra',                    action: () => setEsp('Pediatra', '▶️ 8 — Pediatra') },
    { label: '▶️ 9 — Cardiologista',               action: () => setEsp('CARDIOLOGIA', '▶️ 9 — Cardiologista') },
    { label: '▶️ 10 — Exames Cardiológicos',        action: () => setEsp('CARDIOLOGIA', '▶️ 10 — Exames Cardiológicos') },
    { label: '▶️ 11 — Cirurgião Geral e Gastro',    action: () => setEsp('Cirurgião Geral e Gastro', '▶️ 11 — Cirurgião Geral e Gastro') },
    { label: '▶️ 12 — Cirurgião Cabeça e Pescoço',  action: () => setEsp('Cirurgião Cabeça e Pescoço', '▶️ 12 — Cirurgião Cabeça e Pescoço') },
    { label: '▶️ 13 — Proctologista',              action: () => setEsp('Proctologista', '▶️ 13 — Proctologista') },
    { label: '🔙 Voltar ao Menu',                   action: voltarAgendamento },
  ], 200);
}

async function setEsp(internal, label) {
  if (internal === 'CARDIOLOGIA') { await fluxoCardiologia(); return; }
  state.dados.especialidade = internal;
  state.dados.especialidade_label = label;
  await iniciarColeta(state.origemFluxo, internal, label);
}

async function aposColetaBase() {
  if (state.origemFluxo === 'REMARCAR') {
    state.step = 'RMK_PREF_DATA';
    await showTyping(600);
    await addBotBubble('📅 Para qual <b>dia/período</b> você prefere a nova data/horário?<br><i>Ex: Próxima terça à tarde</i>');
    enableInput('Ex: Terça à tarde...');
  } else if (state.origemFluxo === 'CANCELAR') {
    await perguntarMotivoCancelamento();
  } else if (state.origemFluxo === 'CONFIRMAR') {
    state.step = 'CONF_DATA';
    await showTyping(600);
    await addBotBubble('📅 Qual a <b>data e horário</b> (aproximados) que você tinha agendado?');
    enableInput('Ex: Sexta-feira às 10h...');
  } else {
    // MARCAR ou CARDIOLOGIA
    await exibirChecklist();
  }
}

async function perguntarMotivoCancelamento() {
  await showTyping(600);
  await addBotBubble('Para nos ajudar a melhorar, qual o <b>motivo do cancelamento</b>?');
  await addOptions([
    { label: '1️⃣ Imprevisto Pessoal',      action: async () => { state.dados.motivo_cancelamento = 'IMPREVISTO PESSOAL';      await exibirChecklist(); } },
    { label: '2️⃣ Já resolvi o problema',   action: async () => { state.dados.motivo_cancelamento = 'JA RESOLVI O PROBLEMA';   await exibirChecklist(); } },
    { label: '3️⃣ Atendimento demorado',    action: async () => { state.dados.motivo_cancelamento = 'ATENDIMENTO DEMORADO';    await exibirChecklist(); } },
    {
      label: '4️⃣ Outros',
      action: async () => {
        state.step = 'CAN_MOTIVO_OUTRO';
        await addBotBubble('Descreva brevemente o motivo:');
        enableInput('Motivo...');
      }
    },
  ], 150);
}

// ═══════════════════════════════════════════════
//  FLUXO 5 — CARDIOLOGIA
// ═══════════════════════════════════════════════
async function fluxoCardiologia() {
  state.origemFluxo = 'CARDIOLOGIA';
  state.dados.especialidade = 'Cardiologia / Exames Cardiológicos';
  state.dados.especialidade_label = '🫀 Exames Cardiológicos (setor exclusivo)';
  await showTyping(900);
  await addBotBubble(
    '🫀 <b>Agendamento de Cardiologia / Exames</b>' +
    '<div class="info-box">' +
    'O agendamento de <b>Cardiologia e Exames Cardiológicos</b> (ECG, Holter, etc.) é realizado por um <b>setor exclusivo</b>.<br><br>' +
    '📍 Setor localizado no <b>Ambulatório</b>, com agenda própria e especializada.' +
    '</div>'
  );
  await showTyping(700);
  await iniciarColeta('CARDIOLOGIA', state.dados.especialidade, state.dados.especialidade_label);
}

//  HELPERS COMUNS

</script>
