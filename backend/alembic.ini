# =============================================================================
# ALEMBIC - configuracao do controle de versao do schema
# =============================================================================
#
# PARA QUE SERVE ESTA CAMADA
# -------------------------
# O Alembic e a ponte entre os MODELS (o que voce escreve em Python) e o
# SCHEMA REAL do Postgres (o que os dados veem). Sem ele, existem duas
# formas de "mudar o banco" e as duas sao ruins:
#
#   1. `Base.metadata.create_all` - cria tabela que falta, mas NUNCA altera
#      nem remove tabela que ja existe. A aplicacao sobe sem erro enquanto o
#      banco diverge silenciosamente dos models. Foi assim que a tabela de
#      bilhetagem ficou com colunas (`pabx_call_id`) que o model desconhecia.
#
#   2. SQL na mao, arquivo por arquivo - funciona, mas nao existe registro
#      do que ja foi aplicado. Rodar duas vezes reaplica. Rodar em ordem
#      errada corrompe. E ninguem descobre o estado do banco so olhando.
#
# O Alembic resolve os dois: guarda o estado do schema numa tabela
# (`alembic_version`) e so aplica o que falta.
#
# PARA QUE SERVE CADA COMANDO
# ---------------------------
#   alembic revision --autogenerate -m "msg"
#       Compara os models com o banco e escreve a migration do que falta.
#       Eh o comando que voce usa 95% das vezes.
#   alembic upgrade head
#       Aplica as migrations pendentes no banco.
#   alembic downgrade -1
#       Desfaz a ultima. Alembic so gera downgrade confiavel porque a
#       Base usa naming_convention (app/models/base.py): e ela que da nome
#       estavel para as constraints, senao o downgrade fica adivinhando.
#   alembic current
#       Qual revision o banco esta agora.
#   alembic history
#       Lista as revisions, da mais antiga para a mais nova.
#   alembic upgrade head --sql > mig.sql
#       Gera o SQL sem tocar no banco. Útil para revisar antes de rodar.
#   alembic stamp head
#      Marca o banco como ja atualizado SEM aplicar nada. Use quando o
#       banco real ja esta no formato novo e voce nao quer que o Alembic
#       tente recrear. (Foi o que vao fazer com o banco atual.)
#
# SOBRE A URL DE CONEXAO
# ----------------------
# `sqlalchemy.url` esta VAZIO de proposito: a URL vem do `.env` atraves do
# `app/config.py` (veja alembic/env.py). Hardcodar aqui publicaria usuario
# e senha do banco no Git. Se voce preencher, o Alembic usa o que estiver
# aqui e ignora o .env.
# =============================================================================

[alembic]
script_location = alembic

# Faz o diretorio do projeto entrar no sys.path, para o env.py conseguir
# fazer `from app.config import settings`.
prepend_sys_path = .

# Separador de caminho dos nomes de revision. "os" = os nomes ficam no
# diretorio versions/, sem criar subpastas.
version_path_separator = os

# Revisao base. Alterar isso numa base ja migrateada quebra o historico.
# Em banco novo, o primeiro autogenerate vira este "head".
sqlalchemy.url =


# =============================================================================
# LOG
# =============================================================================
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

# =============================================================================
# HOOKS POS-ESCrita
# =============================================================================
# HOOKS POS-ESCRITA
# =============================================================================
# Deixado SEM hook ativo de proposito. `ruff` nao esta declarado em
# requirements.txt nem instalado no venv, e com o hook configurado TODA
# `alembic revision` terminava em:
#     FAILED: Could not find entrypoint console_scripts.ruff
# Um erro que aparece em toda migration e o jeito mais rapido de ninguem
# usar a ferramenta.
#
# Para reativar: instale o ruff (pip install ruff, ou adicione em
# requirements.txt) e descomente o bloco abaixo. A partir dai o Alembic roda
# `ruff check --fix` no arquivo gerado, antes de voce editar.
#
# [post_write_hooks]
# hooks = ruff_fix
# ruff_fix.type = console_scripts
# ruff_fix.entrypoint = ruff
# ruff_fix.options = check --fix REVISION_SCRIPT_FILENAME
