# Datasource principal (PostgreSQL)
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USER:ecochat}
quarkus.datasource.password=${DB_PASSWORD:ecochat}
quarkus.datasource.jdbc.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ecochatbot}

quarkus.hibernate-orm.database.generation=update
quarkus.hibernate-orm.log.sql=false

# Swagger UI
quarkus.swagger-ui.always-include=true
quarkus.smallrye-openapi.info-title=EcoChatBot MA API
quarkus.smallrye-openapi.info-version=1.0.0

# Datasource para testes (H2 em memória)
%test.quarkus.datasource.db-kind=h2
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
%test.quarkus.hibernate-orm.database.generation=drop-and-create
%test.quarkus.hibernate-orm.log.sql=true
