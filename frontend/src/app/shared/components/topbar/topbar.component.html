<div class="topbar">
  <button class="menu-toggle" (click)="onToggle()">
    <i class="fas fa-bars"></i>
  </button>
  <div class="tb-title">Eco<span>Chat</span> <small>Marcx</small></div>
  <div class="tb-user" *ngIf="usuario">
    <span class="tb-user-nome">{{ usuario.nome }}</span>
    <button class="tb-sair" (click)="onSair()" title="Sair">
      <i class="fas fa-right-from-bracket"></i>
    </button>
  </div>
</div>
