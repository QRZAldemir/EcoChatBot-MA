<div class="page">

  <div *ngIf="alerta" class="alert" [class.success]="alerta.tipo==='sucesso'" [class.error]="alerta.tipo==='erro'">
    <i class="fas" [class.fa-check-circle]="alerta.tipo==='sucesso'" [class.fa-exclamation-circle]="alerta.tipo==='erro'"></i>
    {{ alerta.msg }}
  </div>

  <div class="panel">
    <div class="panel-header">
      <div class="panel-icon red"><i class="fas fa-building"></i></div>
      <h3>Departamentos</h3>
      <button class="btn primary" (click)="abrirNovo()">
        <i class="fas fa-plus"></i> Novo Departamento
      </button>
    </div>

    <div class="table-wrap">
      <div *ngIf="departamentos.length === 0" class="empty">
        Nenhum departamento cadastrado
      </div>

      <table class="tbl" *ngIf="departamentos.length > 0">
        <thead>
          <tr>
            <th>Nome</th>
            <th>Descrição</th>
            <th>Status</th>
            <th>Ações</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let d of departamentos; trackBy: trackById">
            <td><strong>{{ d.nome }}</strong></td>
            <td>{{ d.descricao || '—' }}</td>
            <td>
              <span [class.badge-ativo]="d.ativo" [class.badge-inativo]="!d.ativo">
                {{ d.ativo ? '🟢 Ativo' : '🔴 Inativo' }}
              </span>
            </td>
            <td>
              <button class="btn-icon" (click)="abrirEditar(d)"><i class="fas fa-edit"></i></button>
              <button class="btn-icon danger" (click)="deletar(d.id)"><i class="fas fa-trash"></i></button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<!-- MODAL -->
<div class="overlay" [class.open]="modalAberto" (click.self)="fecharModal()">
  <div class="modal">
    <div class="modal-header">
      <h2>{{ modo === 'novo' ? 'Novo Departamento' : 'Editar Departamento' }}</h2>
      <button class="close-btn" (click)="fecharModal()">✕</button>
    </div>

    <div class="form-grid">
      <div class="fg full">
        <label>Nome *</label>
        <input type="text" [(ngModel)]="form.nome" placeholder="Ex: Call-Center, Recepção, Ouvidoria">
      </div>
      <div class="fg full">
        <label>Descrição</label>
        <input type="text" [(ngModel)]="form.descricao" placeholder="Descrição do departamento">
      </div>
      <div class="fg">
        <label>Status</label>
        <select [(ngModel)]="form.ativo">
          <option [ngValue]="true">🟢 Ativo</option>
          <option [ngValue]="false">🔴 Inativo</option>
        </select>
      </div>
    </div>

    <div class="modal-actions">
      <button class="btn secondary" (click)="fecharModal()">Cancelar</button>
      <button class="btn primary" (click)="salvar()"><i class="fas fa-save"></i> Salvar</button>
    </div>
  </div>
</div>
