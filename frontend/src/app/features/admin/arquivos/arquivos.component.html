<div class="page">

  <div *ngIf="alerta" class="alert" [class.success]="alerta.tipo==='sucesso'" [class.error]="alerta.tipo==='erro'">
    <i class="fas" [class.fa-check-circle]="alerta.tipo==='sucesso'" [class.fa-exclamation-circle]="alerta.tipo==='erro'"></i>
    {{ alerta.msg }}
  </div>

  <div class="panel">
    <div class="panel-header">
      <div class="panel-icon blue"><i class="fas fa-folder"></i></div>
      <h3>Arquivos</h3>
      <button class="btn primary" (click)="abrirNovo()">
        <i class="fas fa-upload"></i> Enviar arquivo
      </button>
    </div>

    <div class="pb">
      <div class="table-wrap">
        <div *ngIf="arquivos.length === 0" class="empty">Nenhum arquivo enviado ainda</div>

        <table class="tbl" *ngIf="arquivos.length > 0">
          <thead>
            <tr>
              <th>Arquivo</th>
              <th>Tipo</th>
              <th>Tamanho</th>
              <th>Descrição</th>
              <th>Enviado em</th>
              <th>Ações</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let a of arquivos; trackBy: trackById">
              <td><i class="fas fa-file arquivo-ico"></i> {{ a.nomeOriginal }}</td>
              <td>{{ a.tipoMime || '—' }}</td>
              <td>{{ formatarTamanho(a.tamanhoBytes) }}</td>
              <td>{{ a.descricao || '—' }}</td>
              <td>{{ a.criadoEm | date:'dd/MM/yyyy HH:mm' }}</td>
              <td class="acoes-col">
                <button class="btn-icon" (click)="baixar(a)" title="Baixar"><i class="fas fa-download"></i></button>
                <button class="btn-icon danger" (click)="deletar(a.id)" title="Remover"><i class="fas fa-trash"></i></button>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<!-- MODAL: ENVIAR ARQUIVO -->
<div class="overlay" [class.open]="modalAberto" (click.self)="fecharModal()">
  <div class="modal">
    <div class="modal-header">
      <h2>Enviar arquivo</h2>
      <button class="close-btn" (click)="fecharModal()">✕</button>
    </div>

    <div class="form-grid">
      <div class="fg full">
        <label>Arquivo *</label>
        <input type="file" (change)="aoSelecionarArquivo($event)">
      </div>
      <div class="fg full">
        <label>Descrição</label>
        <input type="text" [(ngModel)]="descricao" placeholder="Ex: Folder institucional 2026">
      </div>
    </div>

    <div class="modal-actions">
      <button class="btn secondary" (click)="fecharModal()">Cancelar</button>
      <button class="btn primary" [disabled]="enviando" (click)="enviar()"><i class="fas fa-upload"></i> Enviar</button>
    </div>
  </div>
</div>
