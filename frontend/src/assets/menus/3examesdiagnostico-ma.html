<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Central de Diagnósticos — Hospital Mackenzie</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --mac-red:       #c8102e;
    --mac-red-dark:  #a00d24;
    --mac-red-light: #e8102e;
    --mac-red-pale:  #fff5f6;
    --mac-red-hover: #ffe0e4;
    --green:         #25a244;
    --green-pale:    #f0fff4;
    --green-dark:    #1a7a33;
    --blue:          #1565c0;
    --blue-pale:     #e8f0fe;
    --blue-dark:     #0d47a1;
    --yellow:        #e6a817;
    --yellow-pale:   #fffbea;
    --yellow-dark:   #b07d0a;
    --purple:        #7b1fa2;
    --purple-pale:   #f9f0ff;
    --purple-dark:   #4a0072;
    --wa-bg:         #f0ece8;
    --bubble-bot:    #ffffff;
    --bubble-user:   #ffd6d9;
    --wa-text:       #111b21;
    --wa-meta:       #667781;
    --font: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  }

  body {
    font-family: var(--font);
    background: #cfc8c4;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
  }

  .phone-wrap {
    width: 100%;
    max-width: 420px;
    height: 90vh;
    max-height: 820px;
    background: #111;
    border-radius: 40px;
    padding: 10px;
    box-shadow: 0 30px 80px rgba(0,0,0,0.55), inset 0 0 0 2px #2a2a2a;
    display: flex;
    flex-direction: column;
  }

  .screen {
    flex: 1; background: var(--wa-bg);
    border-radius: 32px; overflow: hidden;
    display: flex; flex-direction: column;
  }

  .header {
    background: var(--mac-red);
    padding: 10px 14px 10px 12px;
    display: flex; align-items: center; gap: 10px;
    flex-shrink: 0;
    box-shadow: 0 2px 6px rgba(0,0,0,0.25);
  }
  .mac-logo {
    width: 42px; height: 42px; border-radius: 50%;
    background: #fff; display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; border: 2.5px solid rgba(255,255,255,0.45);
  }
  .mac-logo-ring {
    width: 34px; height: 34px; border-radius: 50%;
    border: 3px solid var(--mac-red);
    display: flex; align-items: center; justify-content: center;
  }
  .mac-logo-ring span {
    font-family: 'Times New Roman', Georgia, serif;
    font-size: 19px; font-weight: 900; color: var(--mac-red);
    line-height: 1; margin-top: 1px;
  }
  .header-info { flex: 1; min-width: 0; }
  .header-name {
    color: #fff; font-weight: 700; font-size: 12.5px;
    line-height: 1.25; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis;
  }
  .header-sub  { color: rgba(255,255,255,0.75); font-size: 10px; line-height: 1.2; margin-top: 1px; }
  .header-status { color: rgba(255,255,255,0.62); font-size: 10.5px; margin-top: 2px; }
  .header-actions { display: flex; gap: 16px; flex-shrink: 0; }
  .header-actions svg { width: 20px; height: 20px; fill: rgba(255,255,255,0.85); cursor: pointer; }

  .chat-area {
    flex: 1; overflow-y: auto;
    padding: 12px 10px;
    display: flex; flex-direction: column; gap: 3px;
    scroll-behavior: smooth;
    background-image: url("data:image/svg+xml,%3Csvg width='52' height='52' viewBox='0 0 52 52' xmlns='http://www.w3.org/2000/svg'%3E%3Ccircle cx='26' cy='26' r='11' fill='none' stroke='%23c8102e' stroke-width='1' stroke-opacity='0.055'/%3E%3C/svg%3E");
  }
  .chat-area::-webkit-scrollbar { width: 4px; }
  .chat-area::-webkit-scrollbar-thumb { background: rgba(200,16,46,0.18); border-radius: 2px; }

  .date-divider { text-align: center; margin: 8px 0; }
  .date-divider span {
    background: rgba(255,255,255,0.88); color: var(--wa-meta);
    font-size: 11.5px; padding: 4px 12px;
    border-radius: 8px; box-shadow: 0 1px 2px rgba(0,0,0,0.1);
  }

  .msg-row { display: flex; flex-direction: column; margin-bottom: 2px; }
  .msg-row.bot  { align-items: flex-start; }
  .msg-row.user { align-items: flex-end; }
  .bubble {
    max-width: 85%; padding: 8px 11px 6px;
    border-radius: 8px; font-size: 14px; line-height: 1.5;
    color: var(--wa-text); word-break: break-word;
    box-shadow: 0 1px 2px rgba(0,0,0,0.12);
    opacity: 0; transform: translateY(6px);
    animation: fadeUp 0.25s ease forwards;
  }
  @keyframes fadeUp { to { opacity: 1; transform: translateY(0); } }
  .msg-row.bot  .bubble { background: var(--bubble-bot);  border-top-left-radius: 2px; }
  .msg-row.user .bubble { background: var(--bubble-user); border-top-right-radius: 2px; }
  .bubble-time {
    font-size: 10.5px; color: var(--wa-meta);
    margin-top: 2px; display: flex; align-items: center; gap: 3px;
  }
  .msg-row.user .bubble-time { justify-content: flex-end; }
  .check-icon { color: var(--mac-red); font-size: 12px; }
  .file-preview {
    max-width: 85%; margin-top: 4px; padding: 8px 12px;
    background: linear-gradient(135deg, rgba(200,16,46,0.1), rgba(200,16,46,0.05));
    border: 1px solid rgba(200,16,46,0.3);
    border-radius: 8px;
    font-size: 12px; color: var(--mac-red-dark);
  }

  .typing-row { display: flex; align-items: flex-start; margin-bottom: 4px; }
  .typing-bubble {
    background: var(--bubble-bot); border-radius: 8px; border-top-left-radius: 2px;
    padding: 12px 14px; box-shadow: 0 1px 2px rgba(0,0,0,0.1);
    display: flex; gap: 5px; align-items: center;
  }
  .typing-dot {
    width: 7px; height: 7px; background: #ccc; border-radius: 50%;
    animation: bounce 1.2s infinite;
  }
  .typing-dot:nth-child(2) { animation-delay: 0.2s; }
  .typing-dot:nth-child(3) { animation-delay: 0.4s; }
  @keyframes bounce {
    0%,80%,100% { transform: translateY(0); background: #ccc; }
    40%         { transform: translateY(-5px); background: var(--mac-red); }
  }

  .options-wrap {
    display: flex; flex-direction: column; gap: 5px;
    margin-top: 4px; opacity: 0;
    animation: fadeUp 0.3s ease 0.1s forwards;
  }
  .opt-btn {
    background: var(--mac-red-pale);
    border: 1.5px solid var(--mac-red);
    color: var(--mac-red-dark);
    padding: 9px 14px; border-radius: 20px;
    font-size: 13.5px; font-family: var(--font); font-weight: 500;
    cursor: pointer; text-align: left;
    transition: background 0.15s, transform 0.1s; line-height: 1.3;
  }
  .opt-btn:hover  { background: var(--mac-red-hover); transform: scale(1.01); }
  .opt-btn:active { transform: scale(0.98); }
  .opt-btn:disabled { opacity: 0.42; pointer-events: none; }
  
  .checklist-card {
    background: linear-gradient(135deg, var(--mac-red-dark), var(--mac-red-light));
    color: #fff; border-radius: 14px;
    padding: 14px 16px; margin-top: 8px;
    font-size: 13.5px; line-height: 1.85;
    box-shadow: 0 4px 14px rgba(200,16,46,0.38);
  }
  .checklist-card .card-title {
    font-size: 14px; font-weight: 700; margin-bottom: 8px;
    border-bottom: 1px solid rgba(255,255,255,0.3);
    padding-bottom: 6px;
  }
  .checklist-card .row { display: flex; flex-direction: column; margin-bottom: 4px; }
  .checklist-card .row b { font-weight: 700; }
  .checklist-card .row span { opacity: 0.88; }

  .protocol-badge {
    background: #fff;
    color: #c8102e;
    padding: 8px 10px;
    border-radius: 12px;
    margin: 6px 0;
    text-align: center;
    font-weight: 600;
    font-size: 0.9em;
  }
  .proto-num {
    display: block;
    font-size: 1em;
    letter-spacing: 0.5px;
    font-family: monospace;
    background: #f5f0ec;
    padding: 2px 6px;
    border-radius: 6px;
    margin-top: 3px;
    font-weight: 700;
  }

  .summary-card {
    color: #fff; border-radius: 14px;
    padding: 14px 16px; margin-top: 8px;
    font-size: 13.5px; line-height: 1.85;
    box-shadow: 0 4px 14px rgba(0,0,0,0.22);
  }
  .summary-card.vermelho {
    background: linear-gradient(135deg, var(--mac-red-dark), var(--mac-red-light));
  }
  .summary-card .card-title {
    font-size: 14px; font-weight: 700; margin-bottom: 8px;
    border-bottom: 1px solid rgba(255,255,255,0.3);
    padding-bottom: 6px;
  }
  .summary-card .row { margin-bottom: 4px; }
  .summary-card .row b { font-weight: 700; }
  .summary-card .row span { opacity: 0.9; }
  .summary-card .badge {
    display: inline-block; background: rgba(255,255,255,0.2);
    border-radius: 6px; padding: 2px 8px; font-size: 12px;
    font-weight: 700; letter-spacing: 0.4px;
  }

  .info-box {
    border-left: 3px solid var(--mac-red); border-radius: 0 6px 6px 0;
    padding: 10px 12px; margin-top: 6px; font-size: 13.5px;
    line-height: 1.75; color: #333;
  }
  .info-box.verde   { background: var(--green-pale);   border-color: var(--green); }
  .info-box.azul    { background: var(--blue-pale);    border-color: var(--blue); }
  .info-box.vermelho{ background: var(--mac-red-pale); border-color: var(--mac-red); }
  .info-box.amarelo { background: var(--yellow-pale);  border-color: var(--yellow); }
  .info-box.roxo    { background: var(--purple-pale);  border-color: var(--purple); }
  .info-box b       { color: var(--mac-red-dark); }
  .info-box.verde b { color: var(--green-dark); }
  .info-box.azul b  { color: var(--blue-dark); }
  .info-box.amarelo b { color: var(--yellow-dark); }
  .info-box.roxo b  { color: var(--purple-dark); }

  .input-area {
    background: #ede8e4; padding: 8px 10px;
    display: flex; align-items: flex-end; gap: 8px;
    flex-shrink: 0; border-top: 1px solid #ddd;
  }
  .input-box-wrap {
    flex: 1; background: #fff; border-radius: 22px;
    display: flex; align-items: flex-end;
    padding: 6px 14px; gap: 8px;
    box-shadow: 0 1px 2px rgba(0,0,0,0.08);
  }
  .input-emoji { font-size: 20px; cursor: pointer; line-height: 1; padding-bottom: 1px; }
  #userInput {
    flex: 1; border: none; outline: none;
    font-family: var(--font); font-size: 14.5px;
    color: var(--wa-text); resize: none;
    max-height: 100px; background: transparent;
    line-height: 1.45; padding: 0;
  }
  #userInput::placeholder { color: #bbb; }
  .attach-icon { font-size: 20px; cursor: pointer; opacity: 0.6; transition: opacity 0.2s; }
  .attach-icon:hover { opacity: 1; }
  #fileInput { display: none; }
  .send-btn {
    width: 46px; height: 46px; background: var(--mac-red);
    border: none; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; flex-shrink: 0;
    transition: background 0.15s, transform 0.1s;
    box-shadow: 0 2px 8px rgba(200,16,46,0.45);
  }
  .send-btn:hover  { background: var(--mac-red-dark); transform: scale(1.05); }
  .send-btn:active { transform: scale(0.95); }
  .send-btn svg { width: 22px; height: 22px; fill: #fff; }
</style>
</head>
<body>

<div class="phone-wrap">
  <div class="screen">
    <div class="header">
      <div class="mac-logo">
        <div class="mac-logo-ring"><span>M</span></div>
      </div>
      <div class="header-info">
        <div class="header-name">Exames e Diagnostico - H.P Mackenzie</div>
        <div class="header-sub">Dr. e Sra. Goldsby King-Dourados/Ms</div>
        <div class="header-status">● online</div>
      </div>
      <div class="header-actions">
        <svg viewBox="0 0 24 24"><path d="M15.9 14.3H15l-.3-.3c1-1.1 1.6-2.7 1.6-4.3 0-3.7-3-6.7-6.7-6.7S3 5.9 3 9.7s3 6.7 6.7 6.7c1.6 0 3.1-.6 4.3-1.6l.3.3v.8l5.1 5.1 1.5-1.5-5-5.2zm-6.2 0C7 14.3 4.7 12 4.7 9.2S7 4.1 9.7 4.1s5.1 2.3 5.1 5.1-2.3 5.1-5.1 5.1z"/></svg>
        <svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="12" cy="19" r="1.5"/></svg>
      </div>
    </div>

    <div class="chat-area" id="chatArea">
      <div class="date-divider"><span>Hoje · Central de Diagnósticos</span></div>
    </div>

    <div class="input-area">
      <div class="input-box-wrap">
        <span class="input-emoji">😊</span>
        <textarea id="userInput" rows="1" placeholder="Escolha uma opção do menu" disabled></textarea>
        <span class="attach-icon" onclick="document.getElementById('fileInput').click();" title="Enviar arquivo">📎</span>
        <input type="file" id="fileInput" accept="image/*,.pdf" onchange="handleFileUpload(event)">
      </div>
      <button class="send-btn" onclick="sendMessage()">
        <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
      </button>
    </div>
  </div>
</div>

<script>
  // ============================= STATE & UTILS ================================
  const state = {
    step: '',
    fluxoAtivo: '',
    dados: {},
    aguardandoTexto: false,
    tentativasInvalidas: 0
  };

  const opcoesSelecionadas = {
    pedidoMedico: null,
    categoriaExame: null,
    modalidade: null,
    medicoAcompanha: null
  };

  const now = () => new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
  const chat = () => document.getElementById('chatArea');
  const getEl = id => document.getElementById(id);
  function scrollBottom() { setTimeout(() => { const c = chat(); c.scrollTop = c.scrollHeight; }, 60); }
  function escapeHtml(str) { return str.replace(/[&<>]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' })[m] || m); }
  function normalizeText(text) {
    if (typeof text !== 'string') return '';
    return text.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toUpperCase();
  }

  function dtHr() {
    return new Date().toLocaleString('pt-BR', { timeZone: 'America/Campo_Grande', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' });
  }

  // ► Cálculo de idade a partir da data de nascimento
  function calcularIdade(dataNascimento) {
    if (!dataNascimento || !/^\d{2}\/\d{2}\/\d{4}$/.test(dataNascimento)) return null;
    const [dia, mes, ano] = dataNascimento.split('/').map(Number);
    const hoje = new Date();
    const dataNasc = new Date(ano, mes - 1, dia);
    let idade = hoje.getFullYear() - dataNasc.getFullYear();
    const mesAtual = hoje.getMonth();
    const diaAtual = hoje.getDate();
    if (mesAtual < mes - 1 || (mesAtual === mes - 1 && diaAtual < dia)) idade--;
    return idade > 0 ? idade : null;
  }

  function gerarProtocolo() {
    const agora = new Date();
    const ano = agora.getFullYear();
    const mes = String(agora.getMonth() + 1).padStart(2, '0');
    const dia = String(agora.getDate()).padStart(2, '0');
    const dataStr = `${ano}${mes}${dia}`;
    const rand = Math.floor(Math.random() * 10000).toString().padStart(4, '0');
    return `HPM-DIAG-${dataStr}-${rand}`;
  }

  // ============================= RENDERERS ================================
  function addBotBubble(html, delay = 0) {
    return new Promise(resolve => {
      setTimeout(() => {
        const row = document.createElement('div');
        row.className = 'msg-row bot';
        row.innerHTML = `<div class="bubble">${html}</div><div class="bubble-time">${now()}</div>`;
        chat().appendChild(row); scrollBottom(); resolve();
      }, delay);
    });
  }

  function addUserBubble(text) {
    const row = document.createElement('div');
    row.className = 'msg-row user';
    row.innerHTML = `<div class="bubble">${escapeHtml(text)}</div>
      <div class="bubble-time">${now()} <span class="check-icon">✓✓</span></div>`;
    chat().appendChild(row); scrollBottom();
  }
  
  function addFilePreview(nomeArquivo) {
    const row = document.createElement('div');
    row.className = 'msg-row user';
    row.innerHTML = `<div class="file-preview">📎 Arquivo enviado: <b>${escapeHtml(nomeArquivo)}</b></div>
      <div class="bubble-time">${now()} <span class="check-icon">✓✓</span></div>`;
    chat().appendChild(row); scrollBottom();
  }

  function addOptions(opts, delay = 0) {
    return new Promise(resolve => {
      setTimeout(() => {
        const wrap = document.createElement('div');
        wrap.className = 'options-wrap';
        opts.forEach(o => {
          const btn = document.createElement('button');
          btn.className = 'opt-btn';
          btn.innerHTML = o.label;
          btn.onclick = () => {
            wrap.querySelectorAll('.opt-btn').forEach(b => { b.disabled = true; b.style.opacity = '0.5'; });
            addUserBubble(o.label);
            o.action();
          };
          wrap.appendChild(btn);
        });
        chat().appendChild(wrap); scrollBottom(); resolve();
      }, delay);
    });
  }

  function showTyping(ms = 1000) {
    return new Promise(resolve => {
      const row = document.createElement('div');
      row.className = 'typing-row'; row.id = 'typingRow';
      row.innerHTML = `<div class="typing-bubble"><div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div></div>`;
      chat().appendChild(row); scrollBottom();
      setTimeout(() => { const el = getEl('typingRow'); if(el) el.remove(); resolve(); }, ms);
    });
  }
  
  function enableInput(ph = 'Digite sua resposta...') {
    const inp = getEl('userInput');
    inp.disabled = false; inp.placeholder = ph; inp.focus();
    state.aguardandoTexto = true;
  }
  function disableInput() {
    const inp = getEl('userInput');
    inp.disabled = true; inp.placeholder = 'Escolha uma opção do menu';
    state.aguardandoTexto = false;
  }

  // ============================= MAIN HANDLERS ================================
  function sendMessage() {
    if (!state.aguardandoTexto) return;
    const inp = getEl('userInput');
    const txt = inp.value.trim(); if (!txt) return;
    inp.value = ''; inp.style.height = 'auto';
    disableInput(); addUserBubble(txt); handleTextInput(txt);
  }

  getEl('userInput').addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  });
  getEl('userInput').addEventListener('input', function() {
    this.style.height = 'auto'; this.style.height = this.scrollHeight + 'px';
  });

  function handleFileUpload(event) {
    const file = event.target.files[0];
    if (!file) return;
    const tiposPermitidos = ['image/jpeg', 'image/png', 'image/gif', 'application/pdf'];
    if (!tiposPermitidos.includes(file.type)) {
      addBotBubble('⚠️ Formato não permitido. Por favor, envie imagem (JPG, PNG) ou PDF.');
      return;
    }
    if (file.size > 5 * 1024 * 1024) {
      addBotBubble('⚠️ Arquivo muito grande. O limite é de 5MB.');
      return;
    }
    state.dados.arquivo_pedido = { nome: file.name, tipo: file.type, tamanho: file.size };
    addFilePreview(file.name);
    addBotBubble('✅ Pedido médico recebido com sucesso!');
    if (state.step === 'AG_PEDIDO_MEDICO') {
      state.dados.tem_pedido_medico = 'SIM (A ENVIAR)';
      opcoesSelecionadas.pedidoMedico = 'Sim, quero enviar (📎)';
      perguntarCategoriaExame();
    }
    getEl('fileInput').value = '';
  }

  // ============================= TEXT INPUT ROUTER ================================
  async function handleTextInput(txt) {
    if (/atendente|humano|pessoa/i.test(txt)) { await falarComAtendenteDiagnosticos(); return; }
    await showTyping(600);

    switch(state.step) {
      case 'AG_NOME_PACIENTE':
        state.dados.nome_paciente = normalizeText(txt);
        state.step = 'AG_DATA_NASC';
        await perguntarDataNascimento();
        break;
      case 'AG_DATA_NASC':
        if (!/^\d{2}\/\d{2}\/\d{4}$/.test(txt)) {
          await addBotBubble('⚠️ Date inválida. Por favor, use o formato DD/MM/AAAA (ex: 15/03/1990).');
          enableInput('Ex: 15/03/1990');
          return;
        }
        state.dados.data_nascimento = txt;
        state.dados.idade = calcularIdade(txt);
        state.step = 'AG_NOME_RESPONSAVEL';
        await perguntarParaQuem();
        break;
      case 'AG_NOME_RESPONSAVEL':
        state.dados.nome_responsavel = normalizeText(txt);
        await perguntarNomeExame();
        break;
      case 'AG_NOME_EXAME':
        state.dados.nome_exame = normalizeText(txt);
        await perguntarPedidoMedico();
        break;
      case 'AG_NOME_PLANO':
        state.dados.plano_saude = normalizeText(txt);
        await perguntarMedicoAcompanha();
        break;
      case 'AG_NOME_MEDICO':
        state.dados.medico_acompanha = normalizeText(txt);
        await exibirChecklistFinal();
        break;
      default:
        await addBotBubble('Desculpe, não entendi. Por favor, escolha uma opção do menu. 😊');
        await mostrarMenuExames(300);
    }
  }
  
  // ============================= AGENDAMENTO FLOW ================================
  async function fluxoAgendarExames() {
    state.fluxoAtivo = 'AGENDAR';
    state.dados = {};
    opcoesSelecionadas.pedidoMedico = null;
    opcoesSelecionadas.categoriaExame = null;
    opcoesSelecionadas.modalidade = null;
    opcoesSelecionadas.medicoAcompanha = null;
    await showTyping(600);
    await addBotBubble('Ok, vamos iniciar o agendamento do seu exame.');
    await perguntarNomePaciente();
  }

  async function perguntarNomePaciente() {
    state.step = 'AG_NOME_PACIENTE';
    await addBotBubble('👤 Para começar, por favor, informe o <b>Nome Completo do Paciente</b>:');
    enableInput('Nome completo do paciente...');
  }

  async function perguntarDataNascimento() {
    await showTyping(500);
    await addBotBubble('📅 <b>Qual a data de nascimento do(a) paciente?</b><br><i>Formato: DD/MM/AAAA</i>');
    enableInput('Ex: 15/03/1990');
  }
  
  async function perguntarParaQuem() {
    state.step = 'AG_PARA_QUEM';
    await addBotBubble('<b>O exame é para você mesmo(a)?</b>');
    await addOptions([
      { label: '1️⃣ Sim, para mim', action: async () => { state.dados.nome_responsavel = 'O PRÓPRIO PACIENTE'; await perguntarNomeExame(); }},
      { label: '2️⃣ Não, para outra pessoa', action: perguntarNomeResponsavel }
    ]);
  }
  
  async function perguntarNomeResponsavel() {
    state.step = 'AG_NOME_RESPONSAVEL';
    await addBotBubble('Certo. E qual o <b>seu nome</b> (responsável pelo agendamento)?');
    enableInput('Seu nome completo...');
  }

  async function perguntarNomeExame() {
    state.step = 'AG_NOME_EXAME';
    await addBotBubble('🔬 Qual o <b>nome do exame</b> que deseja agendar?');
    enableInput('Ex: Tomografia, Raio-X, etc.');
  }

  async function perguntarPedidoMedico() {
    state.step = 'AG_PEDIDO_MEDICO';
    if (state.dados.arquivo_pedido) {
      await addBotBubble('Vi que você já enviou o pedido médico. Ótimo! 👍');
      await perguntarCategoriaExame();
      return;
    }
    await addBotBubble('<b>Você tem o pedido médico?</b> Para muitos exames, ele é indispensável.');
    await addOptions([
      { label: '1️⃣ Sim, quero enviar (📎)', action: async () => { 
          state.dados.tem_pedido_medico = 'SIM (A ENVIAR)';
          opcoesSelecionadas.pedidoMedico = 'Sim, quero enviar (📎)';
          await addBotBubble('Pode anexar o arquivo clicando no ícone de clipe 📎 ao lado do campo de texto.');
          enableInput('Aguardando envio do arquivo...');
        }},
      { label: '2️⃣ Sim, mas não vou enviar agora', action: async () => { 
          state.dados.tem_pedido_medico = 'SIM (NÃO ENVIADO)';
          opcoesSelecionadas.pedidoMedico = 'Sim, mas não vou enviar agora';
          await perguntarCategoriaExame();
        }},
      { label: '3️⃣ Não tenho pedido médico', action: async () => { 
          state.dados.tem_pedido_medico = 'NÃO';
          opcoesSelecionadas.pedidoMedico = 'Não tenho pedido médico';
          await perguntarCategoriaExame();
        }}
    ]);
  }

  async function perguntarCategoriaExame() {
      state.step = 'AG_CATEGORIA_EXAME';
      await addBotBubble('<b>Que tipo de exame é esse?</b>');
      await addOptions([
        { label: '1️⃣ Laboratório', action: () => setCategoriaExame('LABORATÓRIO', 'Laboratório') },
        { label: '2️⃣ Ultrassom', action: () => setCategoriaExame('ULTRASSOM', 'Ultrassom') },
        { label: '3️⃣ Tomografia', action: () => setCategoriaExame('TOMOGRAFIA', 'Tomografia') },
        { label: '4️⃣ Raio-X', action: () => setCategoriaExame('RAIO-X', 'Raio-X') },
        { label: '5️⃣ Ressonância', action: () => setCategoriaExame('RESSONÂNCIA', 'Ressonância') },
        { label: '6️⃣ Outro / Não sei', action: () => setCategoriaExame('A VERIFICAR', 'Outro / Não sei') },
      ]);
  }
  
  async function setCategoriaExame(codigo, label) {
    state.dados.categoria_exame = codigo;
    opcoesSelecionadas.categoriaExame = label;
    await perguntarModalidade();
  }

  async function perguntarModalidade() {
    state.step = 'AG_MODALIDADE';
    await addBotBubble('<b>O atendimento será por qual modalidade?</b>');
    await addOptions([
      { label: '1️⃣ Convênio / Plano de Saúde', action: async () => { 
          state.dados.modalidade_pagamento = 'CONVÊNIO';
          opcoesSelecionadas.modalidade = 'Convênio / Plano de Saúde';
          await perguntarNomePlano(); 
        } },
      { label: '2️⃣ Particular', action: async () => { 
          state.dados.modalidade_pagamento = 'PARTICULAR';
          opcoesSelecionadas.modalidade = 'Particular';
          state.dados.plano_saude = 'N/A';
          await perguntarMedicoAcompanha();
        }}
    ]);
  }

  async function perguntarNomePlano() {
    state.step = 'AG_NOME_PLANO';
    await addBotBubble('Qual o <b>nome do seu convênio / plano de saúde</b>?');
    enableInput('Ex: Pax, HapVida, Cassi, Bradesco...');
  }

  async function perguntarMedicoAcompanha() {
    state.step = 'AG_MEDICO_ACOMPANHA';
    await addBotBubble('<b>O paciente é acompanhado por algum médico em nosso hospital?</b>');
    await addOptions([
      { label: '1️⃣ Sim', action: async () => { opcoesSelecionadas.medicoAcompanha = 'Sim'; await perguntarNomeMedico(); } },
      { label: '2️⃣ Não', action: async () => { 
          state.dados.medico_acompanha = 'NÃO POSSUI';
          opcoesSelecionadas.medicoAcompanha = 'Não';
          await exibirChecklistFinal();
        }}
    ]);
  }

  async function perguntarNomeMedico() {
    state.step = 'AG_NOME_MEDICO';
    await addBotBubble('Por favor, informe o <b>nome do médico</b>:');
    enableInput('Nome do médico...');
  }

  // PASSO FINAL: Checklist com respostas detalhadas
  async function exibirChecklistFinal() {
    await showTyping(1000);
    
    let respStr = state.dados.nome_responsavel && state.dados.nome_responsavel !== 'O PRÓPRIO PACIENTE' ? ` (Resp: ${state.dados.nome_responsavel})` : '';
    let planoStr = state.dados.modalidade_pagamento === 'CONVÊNIO' ? ` - ${state.dados.plano_saude}` : '';
    let pedidoDetalhe = '';
    if (state.dados.arquivo_pedido) pedidoDetalhe = `Arquivo anexado: ${state.dados.arquivo_pedido.nome}`;
    else pedidoDetalhe = opcoesSelecionadas.pedidoMedico || state.dados.tem_pedido_medico || 'NÃO INFORMADO';

    let resumoHtml = `<div class="checklist-card">
      <div class="card-title">✅ Resumo do Agendamento</div>
      <div class="row"><b>📌 Paciente:</b> <span>${state.dados.nome_paciente || 'NÃO PREENCHIDO'}${respStr}</span></div>
      <div class="row"><b>� Data Nasc:</b> <span>${state.dados.data_nascimento || 'NÃO PREENCHIDO'}</span></div>
      <div class="row"><b>🎂 Idade:</b> <span>${state.dados.idade ? state.dados.idade + ' anos' : 'NÃO CALCULADA'}</span></div>
      <div class="row"><b>🔬 Exame:</b> <span>${state.dados.nome_exame || 'NÃO PREENCHIDO'}</span></div>
      <div class="row"><b>📋 Categoria:</b> <span>${opcoesSelecionadas.categoriaExame || state.dados.categoria_exame || 'N/A'}</span></div>
      <div class="row"><b>📄 Pedido médico:</b> <span>${pedidoDetalhe}</span></div>
      <div class="row"><b>💳 Modalidade:</b> <span>${opcoesSelecionadas.modalidade || state.dados.modalidade_pagamento || 'NÃO PREENCHIDO'}${planoStr}</span></div>
      <div class="row"><b>👨‍⚕️ Médico acompanha:</b> <span>${opcoesSelecionadas.medicoAcompanha === 'Sim' ? `Sim - Dr(a). ${state.dados.medico_acompanha || 'NÃO INFORMADO'}` : (state.dados.medico_acompanha === 'NÃO POSSUI' ? 'Não' : state.dados.medico_acompanha || 'NÃO PREENCHIDO')}</span></div>
    </div>`;

    await addBotBubble('Confira os dados do seu pedido de agendamento:' + resumoHtml);
    await showTyping(800);
    await addBotBubble('Os dados estão corretos?');
    await addOptions([
      { label: '✅ Sim, confirmar e transferir', action: finalizarETransferir },
      { label: '✏️ Não, corrigir informações', action: fluxoAgendarExames },
      { label: '🔙 Voltar ao Menu Principal', action: mostrarMenuExames }
    ]);
  }

  // Mensagem final com protocolo de formalização e contato
  async function finalizarETransferir() {
    await showTyping(700);
    const protocolo = gerarProtocolo();
    state.dados.protocolo = protocolo;
    
    await addBotBubble(
      `✅ <b>Agendamento registrado com sucesso!</b><br><br>` +
      `<div class="summary-card vermelho">` +
      `<div class="card-title">🔖 Protocolo de Formalização — Exames e Diagnósticos</div>` +
      `<div class="row"><b>Número:</b> <span class="badge">${protocolo}</span></div><br>` +
      `<div class="card-title">👤 Dados do Paciente</div>` +
      `<div class="row"><b>Nome:</b> <span>${state.dados.nome_paciente}</span></div>` +
      `<div class="row"><b>Data Nasc:</b> <span>${state.dados.data_nascimento}</span></div>` +
      `<div class="row"><b>Idade:</b> <span>${state.dados.idade} anos</span></div><br>` +
      `<div class="card-title">🔬 Exame Solicitado</div>` +
      `<div class="row"><b>Tipo:</b> <span>${state.dados.nome_exame}</span></div>` +
      `<div class="row"><b>Categoria:</b> <span>${opcoesSelecionadas.categoriaExame || 'N/A'}</span></div>` +
      `<div class="row"><b>Modalidade:</b> <span>${opcoesSelecionadas.modalidade}${state.dados.modalidade_pagamento === 'CONVÊNIO' ? ' - ' + state.dados.plano_saude : ''}</span></div><br>` +
      `<div class="card-title">📍 Data/Hora Registro</div>` +
      `<div class="row"><b>Registrado em:</b> <span>${dtHr()}</span></div>` +
      `</div>`
    );
    
    await showTyping(600);
    await addBotBubble(
      '😊 <b>Nossa equipe já recebeu sua solicitação!</b><br><br>' +
      'Um de nossos atendentes <b>confirmará a disponibilidade</b> do exame e definirá o melhor <b>dia e horário</b> para você.<br><br>' +
      '📞 <b>Para acompanhar:</b><br>' +
      '• Ligue para <b>(67) 3416-7800</b> (Ramal Exames)<br>' +
      '• Ou mencione o protocolo <b>' + protocolo + '</b><br><br>' +
      '🏥 <b>Informações Importantes:</b><br>' +
      '• Chegue <b>15 minutos antes</b> do horário marcado<br>' +
      '• Leve <b>RG, CPF e Cartão de Plano/Convênio</b><br>' +
      '• Confirme sua presença <b>24h antes do exame</b><br><br>' +
      '✨ Estamos aqui para ajudá-lo com qualidade!'
    );
    disableInput();
  }

  // ============================= OTHER FLOWS ================================
  async function fluxoResultados() {
    await showTyping(700);
    await addBotBubble(
      '🔒 <b>Acesso Seguro a Resultados</b><br><br>' +
      'Por questões de segurança e sigilo médico (LGPD), seus resultados devem ser acessados exclusivamente pelo nosso <b>Portal do Paciente</b>.<br><br>' +
      'Acesse o link e utilize o Login e Senha entregues na recepção:<br><br>' +
      '<a href="https://modulos.conectew.com.br/conecte/laudos/loginPaciente/view.jsf?edc=265" target="_blank" style="color:#c8102e; font-weight:bold;">🔗 Portal do Paciente Mackenzie</a>'
    );
  }
  
  async function fluxoOrcamentos() {
    await addBotBubble('💰 Para orçamentos, por favor, aguarde. Um de nossos atendentes financeiros irá te ajudar.');
    await falarComAtendenteDiagnosticos();
  }
  
  async function fluxoPreparo() {
     await addBotBubble('🧪 Para instruções de preparo, por favor, aguarde. Um de nossos técnicos irá te ajudar.');
     await falarComAtendenteDiagnosticos();
  }

  async function falarComAtendenteDiagnosticos() {
    await showTyping(700);
    await addBotBubble('🗣️ Transferindo para um de nossos atendentes. Por favor, aguarde. 😊');
    disableInput();
  }

  async function voltarMenuPrincipal() {
    await showTyping(600);
    await addBotBubble('🔙 Retornando ao Menu Principal...');
    setTimeout(() => window.location.reload(), 1200);
  }
  
  // ============================= BOOT SEQUENCE ================================
  async function mostrarMenuExames(delay=200) {
    state.step = 'MENU_EXAMES';
    state.dados = {};
    disableInput();
    await addOptions([
      { label: '1️⃣  📅 Agendar Exames', action: fluxoAgendarExames },
      { label: '2️⃣  📄 Resultados e Laudos', action: fluxoResultados },
      { label: '3️⃣  💰 Orçamentos e Valores', action: fluxoOrcamentos },
      { label: '4️⃣  🧪 Preparo e Orientações', action: fluxoPreparo },
      { label: '5️⃣  🗣️ Falar com Atendente', action: falarComAtendenteDiagnosticos },
      { label: '6️⃣  🔙 Voltar ao Menu Principal', action: voltarMenuPrincipal }
    ], delay);
  }

  async function iniciarCentralDiagnosticos() {
    await showTyping(800);
    await addBotBubble(
      '🔬 <b>Central de Diagnósticos e Exames</b><br>' +
      '<b>Hospital Presbiteriano Mackenzie</b><br><small>Dr. e Sra. Goldsby King</small><br><br>' +
      'Bem-vindo(a) à nossa Central de Diagnósticos! 😊<br><br>' +
      '<div class="info-box verde">' +
      '🔬 <b>O que oferecemos:</b><br>' +
      '• 🧪 <b>Laboratório de Análises Clínicas</b><br>' +
      '• 🖼️ <b>Serviços de Imagem</b> (Raio-X, Ultrassom, Tomografia)<br>' +
      '• 🏥 <b>Exames Especializados</b> (ECG, Holter, Ergometria)' +
      '</div><br>' +
      '🎯 <b>Para darmos início ao seu atendimento, selecione o serviço desejado abaixo:</b>'
    );
    await showTyping(600);
    mostrarMenuExames(300);
  }

  window.onload = () => setTimeout(iniciarCentralDiagnosticos, 600);
</script>
</body>
</html>
