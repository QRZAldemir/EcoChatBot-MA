<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ouvidoria — Hospital Presbiteriano Mackenzie</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    /* ┏━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┓
       ┃ Core Colors — Cores Institucionais ┃
       ┗━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┛ */
    --mac-red:       #c8102e;
    --mac-red-dark:  #a00d24;
    --mac-red-light: #e8102e;
    --mac-red-pale:  #fff5f6;
    --mac-red-hover: #ffe0e4;
    
    /* ┏━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┓
       ┃ Secondary Colors — Cores Secundárias ┃
       ┗━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┛ */
    --green:         #25a244;
    --green-pale:    #f0fff4;
    --green-dark:    #1a7a33;
    
    --blue:          #1565c0;
    --blue-pale:     #e8f0fe;
    --blue-dark:     #0d47a1;
    
    --yellow:        #e6a817;
    --yellow-pale:   #fffbea;
    --yellow-dark:   #b07d0a;
    
    --purple:        #7b1fa2;
    --purple-pale:   #f9f0ff;
    --purple-dark:   #4a0072;
    
    /* ┏━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┓
       ┃ Chat & WhatsApp Theme — Tema Chat ┃
       ┗━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┛ */
    --wa-bg:         #f0ece8;
    --bubble-bot:    #ffffff;
    --bubble-user:   #ffd6d9;
    --wa-text:       #111b21;
    --wa-meta:       #667781;
    
    /* ┏━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┓
       ┃ Typography — Tipografia ┃
       ┗━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┛ */
    --font: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  }

  body {
    font-family: var(--font);
    background: #cfc8c4;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
  }

  /* ── Phone shell ── */
  .phone-wrap {
    width: 100%;
    max-width: 420px;
    height: 90vh;
    max-height: 820px;
    background: #111;
    border-radius: 40px;
    padding: 10px;
    box-shadow: 0 30px 80px rgba(0,0,0,0.55), inset 0 0 0 2px #2a2a2a;
    display: flex;
    flex-direction: column;
  }

  .screen {
    flex: 1;
    background: var(--wa-bg);
    border-radius: 32px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  /* ── Header ── */
  .header {
    background: var(--mac-red);
    padding: 10px 14px 10px 12px;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-shrink: 0;
    box-shadow: 0 2px 6px rgba(0,0,0,0.25);
  }

  /* Logo Mackenzie — CSS puro */
  .mac-logo {
    width: 42px; height: 42px;
    border-radius: 50%;
    background: #fff;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    border: 2.5px solid rgba(255,255,255,0.45);
    box-shadow: 0 1px 4px rgba(0,0,0,0.2);
  }
  .mac-logo-ring {
    width: 34px; height: 34px;
    border-radius: 50%;
    border: 3px solid var(--mac-red);
    display: flex; align-items: center; justify-content: center;
    background: #fff;
  }
  .mac-logo-ring span {
    font-family: 'Times New Roman', Georgia, serif;
    font-size: 19px;
    font-weight: 900;
    color: var(--mac-red);
    line-height: 1;
    margin-top: 1px;
    letter-spacing: -1px;
  }

  .header-info { flex: 1; min-width: 0; }
  .header-name {
    color: #fff;
    font-weight: 700;
    font-size: 12.5px;
    line-height: 1.25;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .header-sub {
    color: rgba(255,255,255,0.75);
    font-size: 10px;
    line-height: 1.2;
    margin-top: 1px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .header-status {
    color: rgba(255,255,255,0.62);
    font-size: 10.5px;
    margin-top: 2px;
  }

  .header-actions { display: flex; gap: 16px; flex-shrink: 0; }
  .header-actions svg { width: 20px; height: 20px; fill: rgba(255,255,255,0.85); cursor: pointer; }

  /* ── Chat area ── */
  .chat-area {
    flex: 1;
    overflow-y: auto;
    padding: 12px 10px;
    display: flex;
    flex-direction: column;
    gap: 3px;
    scroll-behavior: smooth;
    background-image: url("data:image/svg+xml,%3Csvg width='52' height='52' viewBox='0 0 52 52' xmlns='http://www.w3.org/2000/svg'%3E%3Ccircle cx='26' cy='26' r='11' fill='none' stroke='%23c8102e' stroke-width='1' stroke-opacity='0.055'/%3E%3C/svg%3E");
  }
  .chat-area::-webkit-scrollbar { width: 4px; }
  .chat-area::-webkit-scrollbar-thumb { background: rgba(200,16,46,0.18); border-radius: 2px; }

  /* ── Date divider ── */
  .date-divider { text-align: center; margin: 8px 0; }
  .date-divider span {
    background: rgba(255,255,255,0.88);
    color: var(--wa-meta);
    font-size: 11.5px;
    padding: 4px 12px;
    border-radius: 8px;
    box-shadow: 0 1px 2px rgba(0,0,0,0.1);
  }

  /* ── Bubbles ── */
  .msg-row { display: flex; flex-direction: column; margin-bottom: 2px; }
  .msg-row.bot  { align-items: flex-start; }
  .msg-row.user { align-items: flex-end; }

  .bubble {
    max-width: 82%;
    padding: 8px 11px 6px;
    border-radius: 8px;
    font-size: 14px;
    line-height: 1.48;
    color: var(--wa-text);
    word-break: break-word;
    box-shadow: 0 1px 2px rgba(0,0,0,0.12);
    opacity: 0;
    transform: translateY(6px);
    animation: fadeUp 0.25s ease forwards;
  }
  @keyframes fadeUp { to { opacity: 1; transform: translateY(0); } }

  .msg-row.bot  .bubble { background: var(--bubble-bot);  border-top-left-radius: 2px; }
  .msg-row.user .bubble { background: var(--bubble-user); border-top-right-radius: 2px; }

  .bubble-time {
    font-size: 10.5px;
    color: var(--wa-meta);
    margin-top: 2px;
    display: flex; align-items: center; gap: 3px;
  }
  .msg-row.user .bubble-time { justify-content: flex-end; }
  .check-icon { color: var(--mac-red); font-size: 12px; }

  /* ── Typing ── */
  .typing-row { display: flex; align-items: flex-start; margin-bottom: 4px; }
  .typing-bubble {
    background: var(--bubble-bot);
    border-radius: 8px; border-top-left-radius: 2px;
    padding: 12px 14px;
    box-shadow: 0 1px 2px rgba(0,0,0,0.1);
    display: flex; gap: 5px; align-items: center;
  }
  .typing-dot {
    width: 7px; height: 7px;
    background: #ccc; border-radius: 50%;
    animation: bounce 1.2s infinite;
  }
  .typing-dot:nth-child(2) { animation-delay: 0.2s; }
  .typing-dot:nth-child(3) { animation-delay: 0.4s; }
  @keyframes bounce {
    0%,80%,100% { transform: translateY(0); background: #ccc; }
    40%         { transform: translateY(-5px); background: var(--mac-red); }
  }

  /* ═══════════════════════════════════════════ */
  /* ► BOTÕES COM CORES — INTERACTIVE BUTTON STYLES */
  /* ═══════════════════════════════════════════ */
  
  /* Wrapper dos botões — centraliza e anima o grupo */
  .options-wrap {
    display: flex; flex-direction: column; gap: 5px;
    margin-top: 4px;
    opacity: 0;
    animation: fadeUp 0.3s ease 0.1s forwards;
  }
  
  /* Estilo base para todos os botões */
  .opt-btn {
    padding: 9px 14px;
    border-radius: 20px;
    font-size: 13.5px;
    font-family: var(--font);
    font-weight: 500;
    border: 1.5px solid;
    cursor: pointer;
    text-align: left;
    transition: background 0.15s, transform 0.1s, border-color 0.15s;
    line-height: 1.3;
  }
  .opt-btn:hover { transform: scale(1.01); }
  .opt-btn:active { transform: scale(0.98); }
  .opt-btn:disabled { opacity: 0.42; pointer-events: none; }
  
  /* ► VERDE — para ações confirmativas (OK, Continuar, Sim) */
  .opt-btn.verde {
    background: var(--green-pale);
    border-color: var(--green);
    color: var(--green-dark);
  }
  .opt-btn.verde:hover { background: #d4f5de; }
  
  /* ► AZUL — para ações informativas (Consultar, Ver, Info) */
  .opt-btn.azul {
    background: var(--blue-pale);
    border-color: var(--blue);
    color: var(--blue-dark);
  }
  .opt-btn.azul:hover { background: #c3d8fd; }
  
  /* ► VERMELHO — para ações críticas ou cancelar (Cancelar, Não, Deletar) */
  .opt-btn.vermelho {
    background: var(--mac-red-pale);
    border-color: var(--mac-red);
    color: var(--mac-red-dark);
  }
  .opt-btn.vermelho:hover { background: var(--mac-red-hover); }
  
  /* ► AMARELO — para ações de aviso (Atenção, Cuidado, Alerta) */
  .opt-btn.amarelo {
    background: var(--yellow-pale);
    border-color: var(--yellow);
    color: var(--yellow-dark);
  }
  .opt-btn.amarelo:hover { background: #fff0c2; }
  
  /* ► ROXO — para ações especiais ou secundárias (Mais Opções, Especial) */
  .opt-btn.roxo {
    background: var(--purple-pale);
    border-color: var(--purple);
    color: var(--purple-dark);
  }
  .opt-btn.roxo:hover { background: #edd9f7; }
  
  /* ► DEFAULT — estilo padrão (vermelho) */
  .opt-btn.default {
    background: var(--mac-red-pale);
    border-color: var(--mac-red);
    color: var(--mac-red-dark);
  }
  .opt-btn.default:hover { background: var(--mac-red-hover); }

  /* ── Protocol badge ── */
  .protocol-badge {
    background: linear-gradient(135deg, var(--mac-red-dark), var(--mac-red-light));
    color: #fff;
    border-radius: 12px;
    padding: 12px 14px;
    margin-top: 6px;
    font-size: 13px;
    line-height: 1.55;
    box-shadow: 0 3px 10px rgba(200,16,46,0.35);
  }
  .protocol-badge .proto-num {
    font-size: 17px;
    font-weight: 700;
    letter-spacing: 1px;
    display: block;
    margin: 5px 0 3px;
  }

  /* ═══════════════════════════════════════════ */
  /* ► INFORMATION BOXES — Caixas Informativas */
  /* ═══════════════════════════════════════════ */
  
  /* Estilo base — borda lateral colorida com fundo pálido */
  .info-box {
    border-left: 3px solid var(--mac-red);
    border-radius: 0 6px 6px 0;
    padding: 10px 12px;
    margin-top: 6px;
    font-size: 13px;
    line-height: 1.6;
    color: #333;
    background: #fff8f8;
  }
  .info-box b { color: var(--mac-red-dark); }
  
  /* ► VERDE — para sucesso, aprovação, confirmação */
  .info-box.verde {
    background: var(--green-pale);
    border-color: var(--green);
  }
  .info-box.verde b { color: var(--green-dark); }
  
  /* ► AZUL — para informação, detalhes */
  .info-box.azul {
    background: var(--blue-pale);
    border-color: var(--blue);
  }
  .info-box.azul b { color: var(--blue-dark); }
  
  /* ► AMARELO — para aviso, cuidado */
  .info-box.amarelo {
    background: var(--yellow-pale);
    border-color: var(--yellow);
  }
  .info-box.amarelo b { color: var(--yellow-dark); }
  
  /* ► ROXO — para informações especiais */
  .info-box.roxo {
    background: var(--purple-pale);
    border-color: var(--purple);
  }
  .info-box.roxo b { color: var(--purple-dark); }
  
  /* ► SUCCESS — alternativa green (compatibilidade) */
  .info-box.success {
    background: var(--green-pale);
    border-color: var(--green);
  }
  .info-box.success b { color: var(--green-dark); }
  
  /* ► WARNING — alternativa yellow (compatibilidade) */
  .info-box.warning {
    background: var(--yellow-pale);
    border-color: var(--yellow);
  }
  .info-box.warning b { color: var(--yellow-dark); }

  /* ── Input area ── */
  .input-area {
    background: #ede8e4;
    padding: 8px 10px;
    display: flex; align-items: flex-end; gap: 8px;
    flex-shrink: 0;
    border-top: 1px solid #ddd;
  }
  .input-box-wrap {
    flex: 1;
    background: #fff;
    border-radius: 22px;
    display: flex; align-items: flex-end;
    padding: 6px 14px; gap: 8px;
    box-shadow: 0 1px 2px rgba(0,0,0,0.08);
  }
  .input-emoji { font-size: 20px; cursor: pointer; line-height: 1; padding-bottom: 1px; }
  #userInput {
    flex: 1; border: none; outline: none;
    font-family: var(--font); font-size: 14.5px;
    color: var(--wa-text); resize: none;
    max-height: 100px; background: transparent;
    line-height: 1.45; padding: 0;
  }
  #userInput::placeholder { color: #bbb; }
  .attach-icon { font-size: 20px; cursor: pointer; opacity: 0.45; }

  .send-btn {
    width: 46px; height: 46px;
    background: var(--mac-red);
    border: none; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; flex-shrink: 0;
    transition: background 0.15s, transform 0.1s;
    box-shadow: 0 2px 8px rgba(200,16,46,0.45);
  }
  .send-btn:hover  { background: var(--mac-red-dark); transform: scale(1.05); }
  .send-btn:active { transform: scale(0.95); }
  .send-btn svg { width: 22px; height: 22px; fill: #fff; }
</style>
</head>
<body>

<div class="phone-wrap">
  <div class="screen">

    <!-- Header -->
    <div class="header">
      <div class="mac-logo">
        <div class="mac-logo-ring"><span>M</span></div>
      </div>
      <div class="header-info">
        <div class="header-name">Ouvidoria — H. P. Mackenzie</div>
        <div class="header-sub">Dr. e Sra. Goldsby King</div>
        <div class="header-status">● online</div>
      </div>
      <div class="header-actions">
        <svg viewBox="0 0 24 24"><path d="M15.9 14.3H15l-.3-.3c1-1.1 1.6-2.7 1.6-4.3 0-3.7-3-6.7-6.7-6.7S3 5.9 3 9.7s3 6.7 6.7 6.7c1.6 0 3.1-.6 4.3-1.6l.3.3v.8l5.1 5.1 1.5-1.5-5-5.2zm-6.2 0C7 14.3 4.7 12 4.7 9.2S7 4.1 9.7 4.1s5.1 2.3 5.1 5.1-2.3 5.1-5.1 5.1z"/></svg>
        <svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="12" cy="19" r="1.5"/></svg>
      </div>
    </div>

    <!-- Chat -->
    <div class="chat-area" id="chatArea">
      <div class="date-divider"><span>Hoje</span></div>
    </div>

    <!-- Input -->
    <div class="input-area">
      <div class="input-box-wrap">
        <span class="input-emoji">😊</span>
        <textarea id="userInput" rows="1" placeholder="Escolha uma opção acima" disabled></textarea>
        <span class="attach-icon">📎</span>
      </div>
      <button class="send-btn" onclick="sendMessage()">
        <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
      </button>
    </div>

  </div>
</div>

<script>
// ═══════════════════════════════════════════
//  STATE
// ═══════════════════════════════════════════
const state = { step: 'MENU_PRINCIPAL', dados: {}, aguardandoTexto: false };

// ═══════════════════════════════════════════
//  UTILS
// ═══════════════════════════════════════════
const now  = () => new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
const chat = () => document.getElementById('chatArea');
const getEl = id => document.getElementById(id);

function normalizeText(str){return str.trim().toUpperCase();}
function calcularIdade(dataNascimento){
  if(!dataNascimento||!/^\d{2}\/\d{2}\/\d{4}$/.test(dataNascimento))return null;
  const [dia,mes,ano]=dataNascimento.split('/').map(Number);
  const hoje=new Date();
  const dataNasc=new Date(ano,mes-1,dia);
  let idade=hoje.getFullYear()-dataNasc.getFullYear();
  const mesAtual=hoje.getMonth();
  const diaAtual=hoje.getDate();
  if(mesAtual<mes-1||(mesAtual===mes-1&&diaAtual<dia))idade--;
  return idade>0?idade:null;
}

function gerarProtocolo() {
  const d = new Date();
  return `HPM-${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}-${Math.floor(1000+Math.random()*9000)}`;
}

function scrollBottom() {
  setTimeout(() => { const c = chat(); c.scrollTop = c.scrollHeight; }, 60);
}

// ═══════════════════════════════════════════
//  RENDER HELPERS
// ═══════════════════════════════════════════
function addBotBubble(html, delay = 0) {
  return new Promise(resolve => {
    setTimeout(() => {
      const row = document.createElement('div');
      row.className = 'msg-row bot';
      row.innerHTML = `<div class="bubble">${html}</div><div class="bubble-time">${now()}</div>`;
      chat().appendChild(row);
      scrollBottom();
      resolve();
    }, delay);
  });
}

function addUserBubble(text) {
  const row = document.createElement('div');
  row.className = 'msg-row user';
  row.innerHTML = `<div class="bubble">${text}</div>
    <div class="bubble-time">${now()} <span class="check-icon">✓✓</span></div>`;
  chat().appendChild(row);
  scrollBottom();
}

function addOptions(opts, delay = 0) {
  return new Promise(resolve => {
    setTimeout(() => {
      const wrap = document.createElement('div');
      wrap.className = 'options-wrap';
      opts.forEach(o => {
        const btn = document.createElement('button');
        btn.className = 'opt-btn';
        btn.innerHTML = o.label;
        btn.onclick = () => {
          wrap.querySelectorAll('.opt-btn').forEach(b => { b.disabled = true; b.style.opacity = '0.5'; });
          addUserBubble(o.label);
          o.action();
        };
        wrap.appendChild(btn);
      });
      chat().appendChild(wrap);
      scrollBottom();
      resolve();
    }, delay);
  });
}

function showTyping(ms = 1100) {
  return new Promise(resolve => {
    const row = document.createElement('div');
    row.className = 'typing-row';
    row.id = 'typingRow';
    row.innerHTML = `<div class="typing-bubble">
      <div class="typing-dot"></div>
      <div class="typing-dot"></div>
      <div class="typing-dot"></div>
    </div>`;
    chat().appendChild(row);
    scrollBottom();
    setTimeout(() => { const el = getEl('typingRow'); if (el) el.remove(); resolve(); }, ms);
  });
}

function enableInput(ph = 'Digite sua mensagem...') {
  const inp = getEl('userInput');
  inp.disabled = false;
  inp.placeholder = ph;
  inp.focus();
  state.aguardandoTexto = true;
}

function disableInput() {
  const inp = getEl('userInput');
  inp.disabled = true;
  inp.placeholder = 'Escolha uma opção acima';
  state.aguardandoTexto = false;
}

// ═══════════════════════════════════════════
//  SEND
// ═══════════════════════════════════════════
function sendMessage() {
  if (!state.aguardandoTexto) return;
  const inp = getEl('userInput');
  const txt = inp.value.trim();
  if (!txt) return;
  inp.value = ''; inp.style.height = 'auto';
  disableInput();
  addUserBubble(txt);
  handleTextInput(txt);
}

getEl('userInput').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
});
getEl('userInput').addEventListener('input', function () {
  this.style.height = 'auto'; this.style.height = this.scrollHeight + 'px';
});

// ═══════════════════════════════════════════
//  TEXT INPUT ROUTER
// ═══════════════════════════════════════════
async function tratarEntradaInesperada() {
  await showTyping(800);
  await addBotBubble('Desculpe, não entendi. Por favor, escolha uma das opções disponíveis. 😊');
  if (state.step.includes('AGUARDANDO')) {
    await voltarMenu();
  } else {
    await mostrarMenuPrincipal(300);
  }
}

async function handleTextInput(txt) {
  // Atalho: solicitar atendente humano
  if (/atendente|humano|pessoa/i.test(txt)) {
    await showTyping(900);
    await falarComAtendente();
    return;
  }

  await showTyping(1000);

  switch (state.step) {
    case 'AGUARDANDO_RELATO':
    case 'AGUARDANDO_ELOGIO':
    case 'AGUARDANDO_SUGESTAO':
      state.dados.relato_ouvidoria = txt;
      await finalizarRegistro();
      break;

    case 'AGUARDANDO_DENUNCIA':
      state.dados.relato_denuncia = txt;
      await finalizarDenuncia();
      break;

    case 'AGUARDANDO_DADOS_PACIENTE':
      state.dados.dados_paciente_prontuario = txt;
      state.step = 'AGUARDANDO_FORMATO_PRONTUARIO';
      await addBotBubble('Você prefere receber o arquivo <b>digital</b> (PDF por e-mail) ou retirar a <b>cópia física</b> impressa?');
      await addOptions([
        { label: '📧 Digital — PDF por e-mail',   action: () => setFormatoProntuario('Digital (PDF por e-mail)') },
        { label: '📄 Físico — retirar impresso',   action: () => setFormatoProntuario('Físico (impresso)') },
        { label: '🔙 Voltar ao Menu',              action: voltarMenu }
      ], 200);
      break;

    case 'AGUARDANDO_PROTOCOLO':
      await consultarProtocolo(txt);
      break;

    case 'AGUARDANDO_TIPO_SOLICITANTE':
    case 'AGUARDANDO_FORMATO_PRONTUARIO':
      await tratarEntradaInesperada();
      break;

    default:
      await tratarEntradaInesperada();
  }
}

async function consultarProtocolo(num) {
  if (/HPM-\d{8}-\d{4}/i.test(num.replace(/\s/g, ''))) {
    const statusList = [
      'Em análise pela equipe responsável ⏳',
      'Concluído ✅',
      'Aguardando complemento de informação 📝',
      'Encaminhado à gestão 📬'
    ];
    const status = statusList[Math.floor(Math.random() * statusList.length)];
    await addBotBubble(
      '🔍 <b>Protocolo encontrado!</b><br>' +
      `<div class="protocol-badge">📋 ${num.toUpperCase()}<br><br>` +
      `Status: <b>${status}</b></div><br>` +
      'Prazo de resposta: até <b>5 dias úteis</b>.'
    );
    await showTyping(500);
    await addBotBubble('Posso te ajudar com mais alguma coisa?');
    await mostrarMenuPrincipal(300);
  } else {
    await addBotBubble(
      '⚠️ Protocolo não encontrado. Verifique o número e tente novamente.<br>' +
      '<i>Formato esperado: HPM-AAAAMMDD-XXXX</i>'
    );
    await showTyping(400);
    await addOptions([
      { label: '🔁 Tentar novamente',     action: fluxoConsultarProtocolo },
      { label: '🗣️ Falar com atendente', action: falarComAtendente },
      { label: '🔙 Voltar ao Menu',       action: voltarMenu },
    ], 200);
  }
}
